<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatDetect</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-grid"></div>
<div id="app"></div>

<!--
  Load order matters:
    data.js  defines CONFIG, TPL, VIRUSES, LEGIT, DEATHS, ICONS, SHOP_ITEMS, etc.
    audio.js defines the Audio object + per-virus death sounds (uses CONFIG only)
    game.js  defines everything else (state, save, meters, gameplay, views, router)
             and calls render() at the bottom to boot the app.
-->
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
