<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatDetect</title>
<style>
  :root {
    --bg:        hsl(220 20% 4%);
    --bg-2:      hsl(220 20% 6%);
    --card:      hsl(220 20% 7%);
    --fg:        hsl(160 100% 80%);
    --primary:   hsl(160 100% 50%);
    --primary-2: hsl(160 100% 35%);
    --accent:    hsl(190 100% 50%);
    --destruct:  hsl(0 85% 55%);
    --muted:     hsl(220 15% 10%);
    --muted-fg:  hsl(160 20% 50%);
    --border:    hsl(160 40% 15%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", "Segoe UI Mono", monospace; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,255,170,0.035) 0px, rgba(0,255,170,0.035) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: screen;
    z-index: 999;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    z-index: 998;
  }

  /* Ambient animated grid background */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(0,255,170,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.06) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(600px) rotateX(60deg) translateY(20%);
    transform-origin: center top;
    animation: gridDrift 20s linear infinite;
    opacity: 0.4;
  }
  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 56px, 56px 0; }
  }

  #app {
    position: relative;
    height: 100%;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    padding: 24px;
    overflow-y: auto;
  }
  .panel {
    width: 100%;
    max-width: 680px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    box-shadow:
      0 0 0 1px rgba(0,255,170,0.04),
      0 0 60px rgba(0,255,170,0.06);
    position: relative;
  }
  .panel.wide { max-width: 760px; }
  .center { text-align: center; }
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: 0.04em; }
  h1 {
    font-size: 2.6rem;
    color: var(--primary);
    text-shadow: 0 0 14px rgba(0,255,170,0.45);
    letter-spacing: 0.08em;
  }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 0.85rem; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.15em; }
  p { line-height: 1.55; margin: 0; }
  .mute { color: var(--muted-fg); font-size: 0.9rem; }
  .tiny { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-fg); }
  .row { display: flex; gap: 12px; }
  .row.between { justify-content: space-between; align-items: center; }
  .row.center { justify-content: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack.tight { gap: 6px; }
  .stack.loose { gap: 22px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--muted);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
  }
  .btn:hover { transform: translateY(-1px); background: hsl(220 15% 14%); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: var(--primary); color: var(--bg); border-color: var(--primary); box-shadow: 0 0 24px rgba(0,255,170,0.35); }
  .btn.primary:hover { background: var(--primary-2); }
  .btn.danger { background: rgba(255,60,60,0.1); border-color: var(--destruct); color: hsl(0 85% 78%); }
  .btn.danger:hover { background: rgba(255,60,60,0.22); }
  .btn.safe { background: rgba(0,255,170,0.08); border-color: var(--primary); color: var(--primary); }
  .btn.safe:hover { background: rgba(0,255,170,0.18); }
  .btn.big { padding: 16px 22px; font-size: 1rem; flex: 1; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; }

  /* HUD */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .hud .cell {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    cursor: default;
  }
  .hud .label { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted-fg); text-transform: uppercase; }
  .hud .value { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 2px; }
  button.cell { font-family: inherit; cursor: pointer; }
  button.cell:hover { background: hsl(220 15% 12%); }

  /* Fake telemetry meters */
  .meters {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 0.78rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    overflow-x: auto;
  }
  .meter { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .m-label {
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--muted-fg);
    text-transform: uppercase;
  }
  .m-val { color: var(--primary); font-weight: 700; min-width: 1ch; display: inline-block; }
  .m-val.bad  { color: var(--destruct); text-shadow: 0 0 6px var(--destruct); }
  .m-val.warn { color: hsl(40 100% 65%); }
  .m-unit { color: var(--muted-fg); font-size: 0.7rem; }

  /* Menu */
  .logo {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    background: linear-gradient(180deg, #c8ffe6 0%, var(--primary) 60%, hsl(160 100% 30%) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(0,255,170,0.25);
  }
  .menu-btn {
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    font-size: 1rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .menu-btn:hover {
    background: hsl(220 18% 10%);
    border-color: var(--primary-2);
    transform: translateX(4px);
  }
  .menu-btn .arrow { color: var(--primary); }
  .menu-btn.danger { color: hsl(0 70% 75%); }
  .menu-btn.danger:hover { border-color: var(--destruct); }
  .menu-sub { font-size: 0.72rem; color: var(--muted-fg); margin-top: 4px; }

  /* Reveal feedback */
  .reveal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 100;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .reveal.show { opacity: 1; }
  .reveal .stamp {
    font-weight: 900;
    font-size: 2.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 14px 28px;
    border: 4px solid currentColor;
    border-radius: 8px;
    transform: rotate(-7deg);
    text-shadow: 0 0 18px currentColor;
    background: rgba(0,0,0,0.55);
  }
  .reveal.correct .stamp { color: var(--primary); }
  .reveal.wrong .stamp { color: var(--destruct); }

  /* Codex */
  .codex-list {
    max-height: 64vh;
    overflow-y: auto;
    padding-right: 6px;
  }
  .codex-list::-webkit-scrollbar { width: 8px; }
  .codex-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .codex-entry {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 6px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .codex-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .codex-head:hover { background: hsl(220 18% 9%); }
  .codex-head .vname { font-size: 1rem; font-weight: 700; flex: 1; }
  .codex-head .vname.locked { color: var(--muted-fg); letter-spacing: 0.2em; }
  .codex-head .caret { color: var(--muted-fg); transition: transform 0.2s ease; }
  .codex-entry.open .codex-head .caret { transform: rotate(90deg); }
  .codex-body {
    padding: 0 16px 14px 16px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .codex-entry.open .codex-body { display: block; }
  .codex-body .desc { font-size: 0.92rem; color: hsl(160 30% 80%); margin: 12px 0; line-height: 1.55; }
  .codex-body ul { margin: 8px 0 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted-fg); }
  .codex-body li { margin: 3px 0; line-height: 1.45; }

  /* Per-virus accent colors */
  .v-EPILEPTICA { color: #ffffff; }
  .v-MELTDOWN   { color: #ff7733; }
  .v-STATIC     { color: #b0b0b0; }
  .v-REDRUM     { color: #cc1111; }
  .v-VOID       { color: #aa66ff; }
  .v-GASLIGHT   { color: #ffd56b; }
  .v-CRYPTEX    { color: #ffcc00; }
  .v-WORM       { color: #44ff44; }
  .v-ROOTKIT    { color: #ff3300; }
  .v-DDOS       { color: #ff8800; }
  .v-LEECH      { color: #aa00ff; }
  .v-SCREAMER   { color: #ff1166; }
  .v-MIMIC      { color: #66ddff; }
  .v-PULSE      { color: #ff55aa; }
  .v-NULL       { color: #777777; }
  .v-CURSOR     { color: #ffaa44; }
  .v-LOOP       { color: #88ff88; }
  .v-FOSSIL     { color: #c4a484; }
  .v-HEX        { color: #88ddff; }
  .v-BUGBEAR    { color: #ff9966; }
  .codex-entry.v-EPILEPTICA { border-left-color: #ffffff; }
  .codex-entry.v-MELTDOWN   { border-left-color: #ff7733; }
  .codex-entry.v-STATIC     { border-left-color: #b0b0b0; }
  .codex-entry.v-REDRUM     { border-left-color: #cc1111; }
  .codex-entry.v-VOID       { border-left-color: #aa66ff; }
  .codex-entry.v-GASLIGHT   { border-left-color: #ffd56b; }
  .codex-entry.v-CRYPTEX    { border-left-color: #ffcc00; }
  .codex-entry.v-WORM       { border-left-color: #44ff44; }
  .codex-entry.v-ROOTKIT    { border-left-color: #ff3300; }
  .codex-entry.v-DDOS       { border-left-color: #ff8800; }
  .codex-entry.v-LEECH      { border-left-color: #aa00ff; }
  .codex-entry.v-SCREAMER   { border-left-color: #ff1166; }
  .codex-entry.v-MIMIC      { border-left-color: #66ddff; }
  .codex-entry.v-PULSE      { border-left-color: #ff55aa; }
  .codex-entry.v-NULL       { border-left-color: #555555; }
  .codex-entry.v-CURSOR     { border-left-color: #ffaa44; }
  .codex-entry.v-LOOP       { border-left-color: #88ff88; }
  .codex-entry.v-FOSSIL     { border-left-color: #c4a484; }
  .codex-entry.v-HEX        { border-left-color: #88ddff; }
  .codex-entry.v-BUGBEAR    { border-left-color: #ff9966; }

  /* Animations */
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .flicker { animation: flicker 3.2s infinite; }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.78; }
  }
  .glitch {
    font-weight: 900;
    display: inline-block;
    text-shadow: 2px 0 var(--accent), -2px 0 var(--destruct);
    animation: glitch 0.55s infinite steps(2, end);
  }
  @keyframes glitch {
    0%{transform:translate(0,0);} 20%{transform:translate(-2px,1px);}
    40%{transform:translate(2px,-1px);} 60%{transform:translate(-1px,-2px);}
    80%{transform:translate(1px,2px);} 100%{transform:translate(0,0);}
  }
  /* UI tampering effects on the popup wrapper */
  .tamper-pulse { animation: tamperPulse 0.9s ease-in-out infinite; }
  @keyframes tamperPulse {
    0%, 100% { filter: brightness(1) saturate(1); transform: scale(1); }
    50%      { filter: brightness(1.25) saturate(1.1); transform: scale(1.015); }
  }
  .tamper-pulse-hard { animation: tamperPulseHard 0.55s ease-in-out infinite; }
  @keyframes tamperPulseHard {
    0%, 100% { filter: brightness(0.7); transform: scale(0.99); }
    50%      { filter: brightness(1.4); transform: scale(1.025); }
  }
  .tamper-shake { animation: tamperShake 0.18s ease-in-out infinite; }
  @keyframes tamperShake {
    0% { transform: translate(0,0); } 25% { transform: translate(-1px,1px); }
    50% { transform: translate(1px,-1px); } 75% { transform: translate(-1px,-1px); }
    100% { transform: translate(0,0); }
  }
  .tamper-null { opacity: 0.94; }
  .tamper-null .win-actions, .tamper-null .av-actions { visibility: hidden; }

  /* ============== POPUP TEMPLATES ============== */

  /* WIN11 LIGHT DIALOG */
  .win-dialog {
    background: #f3f3f3;
    color: #1b1b1b;
    border: 1px solid #c8c8c8;
    border-radius: 8px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.04),
      0 22px 60px rgba(0,0,0,0.6),
      0 6px 18px rgba(0,0,0,0.35);
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .win-titlebar {
    display: flex; align-items: stretch; height: 32px;
    background: #f3f3f3; border-bottom: 1px solid #e6e6e6;
  }
  .win-titlebar-left { display: flex; align-items: center; gap: 8px; padding: 0 12px; flex: 1; min-width: 0; }
  .win-app-icon {
    width: 16px; height: 16px; border-radius: 3px;
    background: linear-gradient(135deg, #0078d4 0%, #50b0ef 100%);
    flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }
  .win-title { font-size: 12px; color: #1b1b1b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-tb-btns { display: flex; }
  .win-tb-btn {
    width: 46px; height: 32px; border: 0; background: transparent; color: #1b1b1b;
    font-size: 10px; line-height: 1; cursor: default;
    display: flex; align-items: center; justify-content: center;
  }
  .win-tb-btn:hover { background: rgba(0,0,0,0.06); }
  .win-tb-btn.close:hover { background: #c42b1c; color: #fff; }
  .win-body { background: #ffffff; display: flex; gap: 16px; padding: 24px 24px 16px 24px; }
  .win-error-icon { flex-shrink: 0; margin-top: 2px; }
  .win-content { flex: 1; min-width: 0; }
  .win-heading { font-size: 16px; font-weight: 600; color: #1b1b1b; margin: 0 0 8px; line-height: 1.3; }
  .win-message { font-size: 14px; color: #1b1b1b; line-height: 1.45; margin-bottom: 8px; word-wrap: break-word; }
  .win-meta { font-size: 12px; color: #5a5a5a; word-break: break-word; }
  .win-actions { background: #f3f3f3; border-top: 1px solid #e6e6e6; padding: 14px 24px; display: flex; justify-content: flex-end; gap: 8px; }

  /* FAKE ANTIVIRUS WARNING */
  .av-dialog {
    background: linear-gradient(180deg, #fff7e6 0%, #ffe1c2 100%);
    color: #401400;
    border: 2px solid #b03000;
    border-radius: 6px;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    box-shadow: 0 0 0 1px #ffaa66, 0 20px 50px rgba(0,0,0,0.55);
  }
  .av-header {
    background: linear-gradient(180deg, #d62828, #b03000);
    color: #ffffff;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 800;
  }
  .av-header .badge {
    background: #fff; color: #b03000; padding: 3px 8px; border-radius: 3px;
    font-size: 10px; letter-spacing: 0.18em;
  }
  .av-body { padding: 22px; display: flex; gap: 18px; }
  .av-icon { font-size: 48px; line-height: 1; flex-shrink: 0; }
  .av-content { flex: 1; }
  .av-heading { font-size: 20px; font-weight: 800; color: #b03000; margin-bottom: 8px; text-transform: uppercase; }
  .av-message { font-size: 14px; line-height: 1.5; }
  .av-meta { margin-top: 10px; font-size: 12px; color: #5a2200; font-family: Consolas, monospace; }
  .av-actions { background: #ffe6cc; padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; }

  /* BIOS SCREEN */
  .bios {
    background: #0000a0;
    color: #ffffff;
    font-family: "Cascadia Mono", Consolas, "Lucida Console", monospace;
    border: 4px double #ffffff;
    padding: 16px;
    line-height: 1.4;
    font-size: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .bios-header {
    text-align: center; background: #c0c0c0; color: #0000a0;
    padding: 4px; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 12px;
  }
  .bios-row { display: flex; gap: 8px; }
  .bios-key { color: #ffff00; }
  .bios-warn { background: #ffff00; color: #0000a0; padding: 2px 6px; font-weight: 700; display: inline-block; margin-top: 8px; }
  .bios-actions {
    border-top: 1px dashed #ffffff;
    margin-top: 14px; padding-top: 10px;
    display: flex; justify-content: space-around;
    font-size: 13px;
  }
  .bios-actions .key { background: #c0c0c0; color: #0000a0; padding: 2px 8px; margin-right: 4px; font-weight: 700; }

  /* CORRUPTED TERMINAL */
  .term {
    background: #000;
    color: #4dff7c;
    font-family: "Cascadia Mono", Consolas, "Lucida Console", monospace;
    border: 1px solid #226633;
    border-radius: 4px;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 0 30px rgba(0,255,140,0.15), 0 20px 50px rgba(0,0,0,0.55);
  }
  .term-titlebar { background: #1a1a1a; color: #aaa; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #226633; }
  .term-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; box-shadow: 0 0 6px #ff4444; }
  .term-body { padding: 14px 16px; }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-line .prompt { color: #4dff7c; }
  .term-line .err { color: #ff5555; }
  .term-line .warn { color: #ffcc00; }
  .term-line .ok { color: #66ddff; }
  .term-cursor { display: inline-block; width: 7px; height: 14px; background: #4dff7c; vertical-align: -2px; animation: termBlink 1s steps(2) infinite; }
  @keyframes termBlink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
  .term-actions { padding: 10px 16px; background: #001100; border-top: 1px solid #226633; display: flex; justify-content: flex-end; gap: 10px; }
  .term-btn {
    background: #003300; color: #4dff7c; border: 1px solid #4dff7c;
    padding: 6px 14px; font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .term-btn:hover { background: #006600; }

  /* DESKTOP NOTIFICATION TOAST */
  .toast-stage {
    position: relative;
    height: 220px;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(0,80,140,0.4) 0%, transparent 70%),
      linear-gradient(180deg, #1f3a5f 0%, #0f1f33 100%);
    border-radius: 8px;
    border: 1px solid #2a4a73;
    overflow: hidden;
  }
  .toast-stage::after {
    content: "";
    position: absolute; left: 18px; bottom: 14px;
    width: 160px; height: 4px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
  }
  .toast {
    position: absolute; right: 18px; bottom: 36px;
    width: 320px;
    background: #2b2b2b;
    color: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;

    content: ""; position: absolute; inset: 25%;

    from { transform: scale(0.5) rotate(0deg);   opacity: 0; }

    content: "recurse() → recurse() → recurse() → recurse() → recurse() → recurse() → ";

    animation: loopScroll 4s linear infinite;

const CONFIG = {

  cardsPerRound: 10,
  totalRounds: 10,

/* ============================================================
   SAVE
   ============================================================ */

const SAVE_KEY = "threatdetect_save_v1";

const Save = {
  defaults() {
    return {
      highestRound: 1,
      unlocked: CONFIG.starterUnlocked.slice(),
      settings: { master: 0.8, ambient: 0.4, sfx: 0.8, photosensitive: false }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return Save.defaults();
      const parsed = JSON.parse(raw);
      const d = Save.defaults();
      return {
        highestRound: parsed.highestRound || d.highestRound,
        unlocked: parsed.unlocked || d.unlocked,
        settings: Object.assign(d.settings, parsed.settings || {})
      };
    } catch (e) { return Save.defaults(); }
  },
  write(s) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
  },
  reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }
};

let save = Save.load();

function unlockVirus(key) {
  if (!save.unlocked.includes(key)) {
    save.unlocked.push(key);
    Save.write(save);
  }
}

/* ============================================================
   AUDIO (procedural via Web Audio API)
   Extension point: drop base64 wav/mp3 strings into AUDIO_BLOBS
   keyed by sound name; the player will prefer them if present.
   ============================================================ */

const AUDIO_BLOBS = {
  // Example:
  // scream: "data:audio/wav;base64,UklGR..."
};

const Audio = {
  ctx: null, masterGain: null, ambientGain: null, sfxGain: null,
  ambientNodes: null,
  unlocked: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = save.settings.master;
    this.masterGain.connect(this.ctx.destination);
    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = save.settings.ambient;
    this.ambientGain.connect(this.masterGain);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = save.settings.sfx;
    this.sfxGain.connect(this.masterGain);
  },
  resume() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    this.unlocked = true;
  },
  applyVolumes() {
    if (!this.ctx) return;
    this.masterGain.gain.value  = save.settings.master;
    this.ambientGain.gain.value = save.settings.ambient;
    this.sfxGain.gain.value     = save.settings.sfx;
  },
  startAmbient() {
    if (!this.ctx || this.ambientNodes) return;
    const ctx = this.ctx;
    const o1 = ctx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = 55;
    const o2 = ctx.createOscillator(); o2.type = "sawtooth"; o2.frequency.value = 55.4;
    const o3 = ctx.createOscillator(); o3.type = "sine";     o3.frequency.value = 110;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 320; lp.Q.value = 0.4;
    const g = ctx.createGain(); g.gain.value = 0.0;
    o1.connect(lp); o2.connect(lp); o3.connect(lp); lp.connect(g); g.connect(this.ambientGain);
    o1.start(); o2.start(); o3.start();
    g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 1.5);
    const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.15;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 90;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency); lfo.start();
    this.ambientNodes = { o1, o2, o3, lp, g, lfo, lfoGain };
  },
  stopAmbient() {
    if (!this.ambientNodes) return;
    const { o1, o2, o3, g, lfo } = this.ambientNodes;
    const t = this.ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.5);
    o1.stop(t + 0.6); o2.stop(t + 0.6); o3.stop(t + 0.6); lfo.stop(t + 0.6);
    this.ambientNodes = null;
  },
  _env(g, t, a, d, peak) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  click() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "square"; o.frequency.value = 720;
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.sfxGain);
    this._env(g, t, 0.001, 0.05, 0.18);
    o.start(t); o.stop(t + 0.08);
  },
  correct() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [659.25, 987.77].forEach((f, i) => {
      const o = this.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      this._env(g, t + i * 0.07, 0.005, 0.16, 0.22);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.22);
    });
  },
  wrong() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.45);
    const g = this.ctx.createGain();
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
    o.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    this._env(g, t, 0.002, 0.5, 0.32);
    o.start(t); o.stop(t + 0.55);
  },
  scream() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = 540;
    const o2 = this.ctx.createOscillator(); o2.type = "sawtooth"; o2.frequency.value = 547;
    const vibrato = this.ctx.createOscillator(); vibrato.type = "sine"; vibrato.frequency.value = 9;
    const vibratoGain = this.ctx.createGain(); vibratoGain.gain.value = 30;
    vibrato.connect(vibratoGain);
    vibratoGain.connect(o1.frequency); vibratoGain.connect(o2.frequency);
    const dist = this.ctx.createWaveShaper();
    const k = 50, samples = 1024, curve = new Float32Array(samples);
    for (let i = 0; i < samples; i++) {
      const x = i * 2 / samples - 1;
      curve[i] = (3 + k) * x * 20 / (Math.PI + k * Math.abs(x));
    }
    dist.curve = curve;
    const hp = this.ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 300;
    const g = this.ctx.createGain();
    o1.connect(dist); o2.connect(dist); dist.connect(hp); hp.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.55, t + 0.04);
    g.gain.linearRampToValueAtTime(0.45, t + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o1.start(t); o2.start(t); vibrato.start(t);
    o1.stop(t + 1.2); o2.stop(t + 1.2); vibrato.stop(t + 1.2);
  },
  glitch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.25, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 2;
    const g = this.ctx.createGain(); g.gain.value = 0.35;
    src.connect(bp); bp.connect(g); g.connect(this.sfxGain);
    src.start(t);
  },
  heartbeat() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 60;
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.sfxGain);
    this._env(g, t, 0.005, 0.18, 0.4);
    this._env(g, t + 0.22, 0.005, 0.2, 0.35);
    o.start(t); o.stop(t + 0.6);
  },
  gameOver() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(55, t + 1.4);
    const g = this.ctx.createGain();
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200;
    o.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    this._env(g, t, 0.01, 1.4, 0.4);
    o.start(t); o.stop(t + 1.5);
  },
  levelUp() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = this.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      this._env(g, t + i * 0.09, 0.005, 0.22, 0.24);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.3);
    });
  }
};

/* ============================================================
   Per-virus death sounds (all procedural)
   ============================================================ */

Audio.death = function(key) {
  if (!this.ctx) return;
  const fn = this.deaths[key];
  if (fn) fn.call(this);
  else this.gameOver();
};

Audio.noiseBurst = function(start, duration, freq, q, gain) {
  const ctx = this.ctx;
  const buf = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * duration), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(bp); bp.connect(g); g.connect(this.sfxGain);
  src.start(start);
};

Audio.beep = function(start, freq, dur, type, gain) {
  const ctx = this.ctx;
  const o = ctx.createOscillator(); o.type = type || "square"; o.frequency.value = freq;
  const g = ctx.createGain();
  o.connect(g); g.connect(this.sfxGain);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(gain || 0.18, start + 0.003);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  o.start(start); o.stop(start + dur + 0.02);
};

Audio.deaths = {
  EPILEPTICA() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 28; i++) {
      this.beep(t + i * 0.13, 1400 + (i % 2) * 700, 0.08, "square", 0.18);
    }
  },
  MELTDOWN() {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 4);
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    const g = this.ctx.createGain();
    o.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.42, t + 0.3);
    g.gain.linearRampToValueAtTime(0.42, t + 3);
    g.gain.exponentialRampToValueAtTime(0.001, t + 4);
    o.start(t); o.stop(t + 4.1);
    for (let i = 0; i < 14; i++) this.noiseBurst(t + Math.random() * 3.5, 0.04, 2000 + Math.random() * 1500, 2, 0.2);
  },
  STATIC() {
    const ctx = this.ctx, t = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.5;
    bp.frequency.setValueAtTime(2200, t);
    bp.frequency.exponentialRampToValueAtTime(280, t + 3.5);
    const g = ctx.createGain(); g.gain.value = 0.28;
    src.connect(bp); bp.connect(g); g.connect(this.sfxGain);
    src.start(t);
  },
  REDRUM() {
    const t = this.ctx.currentTime;
    [55, 82.5].forEach(f => {
      const o = this.ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.4);
      g.gain.linearRampToValueAtTime(0.18, t + 3.5);
      g.gain.exponentialRampToValueAtTime(0.001, t + 4.5);
      o.start(t); o.stop(t + 4.6);
    });
    const bell = this.ctx.createOscillator(); bell.type = "triangle"; bell.frequency.value = 247.5;
    const bg = this.ctx.createGain();
    bell.connect(bg); bg.connect(this.sfxGain);
    bg.gain.setValueAtTime(0, t + 0.4);
    bg.gain.linearRampToValueAtTime(0.42, t + 0.42);
    bg.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
    bell.start(t + 0.4); bell.stop(t + 2.3);
  },
  VOID() {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 420;
    o.frequency.exponentialRampToValueAtTime(18, t + 4);
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0.32, t);
    g.gain.linearRampToValueAtTime(0.32, t + 0.5);
    g.gain.linearRampToValueAtTime(0, t + 4);
    o.start(t); o.stop(t + 4.1);
  },
  GASLIGHT() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 24; i++) {
      const delay = i * 0.16 + (Math.random() - 0.5) * 0.1;
      this.beep(t + delay, 780 + Math.random() * 220, 0.03, "triangle", 0.16);
    }
  },
  CRYPTEX() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 12; i++) this.beep(t + i * 0.32, 300 - i * 18, 0.1, "square", 0.22);
  },
  WORM() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 22; i++) {
      const start = t + i * 0.14 + Math.random() * 0.04;
      const o = this.ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.value = 220 + Math.random() * 220;
      o.frequency.linearRampToValueAtTime(o.frequency.value * 2, start + 0.08);
      const g = this.ctx.createGain();
      const hp = this.ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 600;
      o.connect(hp); hp.connect(g); g.connect(this.sfxGain);
      g.gain.setValueAtTime(0.18, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.1);
      o.start(start); o.stop(start + 0.12);
    }
  },
  ROOTKIT() {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 2);
    const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800;
    const g = this.ctx.createGain();
    o.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0.5, t);
    g.gain.linearRampToValueAtTime(0.4, t + 1.5);
    g.gain.linearRampToValueAtTime(0, t + 4.5);
    o.start(t); o.stop(t + 4.6);
  },
  DDOS() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 60; i++) this.beep(t + i * 0.07, 1200 + (i % 3) * 300, 0.05, "square", 0.1);
  },
  LEECH() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 38; i++) {
      const start = t + i * 0.11 + Math.random() * 0.04;
      this.beep(start, 1800 + Math.random() * 400, 0.025, "square", 0.13);
    }
  },
  SCREAMER() {
    this.scream();
    setTimeout(() => this.scream(), 1100);
  },
  MIMIC() {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 800;
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.05);
    g.gain.linearRampToValueAtTime(0.25, t + 0.5);
    o.start(t);
    o.frequency.setValueAtTime(800, t + 0.6);
    o.frequency.exponentialRampToValueAtTime(55, t + 3);
    g.gain.linearRampToValueAtTime(0.42, t + 2);
    g.gain.linearRampToValueAtTime(0, t + 4);
    o.stop(t + 4.1);
  },
  PULSE() {
    for (let i = 0; i < 6; i++) setTimeout(() => this.heartbeat(), i * 800);
  },
  NULL() {
    const t = this.ctx.currentTime;
    const start = t + 2;
    const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 50;
    const g = this.ctx.createGain();
    o.connect(g); g.connect(this.sfxGain);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.55, start + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
    o.start(start); o.stop(start + 0.7);
  },
  CURSOR() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 14; i++) {
      const start = t + i * 0.33 + Math.random() * 0.08;
      this.beep(start, 600 + Math.random() * 600, 0.06, "square", 0.14);
    }
  },
  LOOP() {
    const t = this.ctx.currentTime;
    for (let i = 0; i < 8; i++) {
      const start = t + i * 0.55;
      const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 200;
      o.frequency.exponentialRampToValueAtTime(800, start + 0.5);
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.2, start + 0.05);
      g.gain.linearRampToValueAtTime(0.2, start + 0.4);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.55);
      o.start(start); o.stop(start + 0.6);
    }
  },
  FOSSIL() {
    const t = this.ctx.currentTime;
    [1209, 1336, 1477].forEach((f, i) => {
      const start = t + i * 0.5;
      const o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.18, start + 0.05);
      g.gain.linearRampToValueAtTime(0.18, start + 0.4);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
      o.start(start); o.stop(start + 0.55);
    });
    this.noiseBurst(t + 1.7, 2.5, 1500, 0.8, 0.18);
  },
  HEX() {
    const t = this.ctx.currentTime;
    const tones = [220, 275, 330, 415];
    for (let i = 0; i < 18; i++) this.beep(t + i * 0.22, tones[i % 4] * 2 + (i * 13), 0.18, "square", 0.16);
  },
  BUGBEAR() {
    const t = this.ctx.currentTime;
    [880, 1108, 1318, 1568, 880, 1108, 1318, 1568].forEach((f, i) => {
      const start = t + i * 0.18 + (i >= 4 ? 0.4 : 0);
      const o = this.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.sfxGain);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.22, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      o.start(start); o.stop(start + 0.45);
    });
  }
};

/* ============================================================
   METERS (fake telemetry — never reads real system values)
   ============================================================ */

const FAKE_CLOCK_START = Date.UTC(2031, 5, 12, 14, 23, 7);
let fakeClock = FAKE_CLOCK_START;

function pad2(n) { return String(n).padStart(2, "0"); }
function rng(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

const METERS = {
  timer: null,
  override: null,
  state: { fps: 60, ping: 24, cpu: 47, vol: 72, time: "14:23:07" },
  start() {
    if (this.timer) return;
    this.tick();
    this.timer = setInterval(() => this.tick(), 700);
  },
  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  },
  setOverride(eff) {
    this.override = eff || null;
    this.tick();
  },
  tick() {
    const s = this.state;
    s.fps  = clamp(s.fps  + rng(-2, 2), 56, 64);
    s.ping = clamp(s.ping + rng(-3, 3), 18, 32);
    s.cpu  = clamp(s.cpu  + rng(-2, 2), 42, 56);
    s.vol  = clamp(s.vol  + rng(-1, 1), 64, 78);
    fakeClock += 700 + rng(0, 600);
    const d = new Date(fakeClock);
    s.time = pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes()) + ":" + pad2(d.getUTCSeconds());
    this.paint();
  },
  paint() {
    const o = this.override || {};
    const set = (key, base) => {
      const el = document.querySelector('[data-m="' + key + '"]');
      if (!el) return;
      const tampered = key in o;
      el.textContent = tampered ? this.applyEffect(key, o[key]) : base;
      el.classList.toggle("bad", tampered);
    };
    set("fps",  this.state.fps);
    set("ping", this.state.ping);
    set("cpu",  this.state.cpu);
    set("vol",  this.state.vol);
    set("time", this.state.time);
  },
  applyEffect(key, mode) {
    if (typeof mode === "number") return String(mode);
    switch (mode) {
      case "flash":     return Math.random() < 0.5 ? "0"   : "999";
      case "null":      return Math.random() < 0.5 ? "NULL": "∞";
      case "pulse":     return Math.random() < 0.4 ? "120" : "60";
      case "blank":     return "—";
      case "kernel":    return "KERNEL";
      case "countdown": return "00:00:0" + Math.floor(Math.random() * 9);
      case "wrong":     return rand(["1601-01-01", "9999-12-31", "2025-02-30", "0000:00:00"]);
      case "room237":   return this.state.time.slice(0, 3) + "37:" + this.state.time.slice(6);
      case "spike":     return Math.random() < 0.5 ? String(this.state.ping) : "9999";
      default:          return String(mode);
    }
  }
};

function meterEffectFor(card) {
  if (!card || !card.isVirus) return null;
  const v = VIRUSES[card.virusKey];
  return v && v.meterEffect ? v.meterEffect : null;
}

/* ============================================================
   STATE
   ============================================================ */

const state = {
  screen: "epilepsy-warning",
  prevScreen: "menu",
  // play state
  score: 0, round: 1, lives: CONFIG.startLives,
  streak: 0, deck: [], cardIdx: 0,
  correct: 0, total: 0,
  killer: null,         // virus key when died to virus
  falsePositive: null,  // legit card object when died to false positive
  locked: false,
  // codex
  openCodex: null,      // key of currently expanded entry
  codexFilter: null,    // when set, codex shows only this virus
  // training
  trainingVirus: null,
  trainingStreak: 0,
  // ui tampering
  tampering: null,      // { type: 'swap'|'pulse'|'shake'|'null', strength: 0..1 }
  // death sequence timer
  deathTimeout: null
};

/* ============================================================
   HELPERS
   ============================================================ */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function availableViruses(round) {
  return Object.keys(VIRUSES).filter(k => VIRUSES[k].minRound <= round);
}

function buildDeck(round) {
  const avail = availableViruses(round);
  const virusCards = [];
  avail.forEach(k => VIRUSES[k].errors.forEach(e => virusCards.push({ ...e, isVirus: true, virusKey: k })));
  const legitCards = LEGIT.map(e => ({ ...e, isVirus: false, virusKey: null }));
  // Virus density ramps from ~20% (round 1) to ~70% (round 10)
  const virusRatio = Math.min(0.7, 0.2 + (round - 1) * 0.06);
  const virusCount = Math.min(virusCards.length, Math.max(2, Math.round(CONFIG.cardsPerRound * virusRatio)));
  const legitCount = CONFIG.cardsPerRound - virusCount;
  const pickedViruses = shuffle(virusCards).slice(0, virusCount);
  const pickedLegit   = shuffle(legitCards).slice(0, legitCount);
  return shuffle(pickedViruses.concat(pickedLegit));
}

function rollTampering(round, card) {
  if (round < 4) return null;
  if (card.virusKey === "PULSE") {
    return { type: round >= 7 ? "pulseHard" : "pulse" };
  }
  if (card.virusKey === "NULL") {
    return { type: "null" };
  }
  if (card.virusKey === "SCREAMER") {
    return { type: round >= 7 ? "shake" : "pulseHard" };
  }
  // Other virus cards: chance of light tampering scaling with round
  const chance = Math.min(0.35, (round - 3) * 0.05);
  if (card.isVirus && Math.random() < chance) {
    const opts = round >= 7 ? ["swap", "pulse", "shake"] : ["swap", "pulse"];
    return { type: rand(opts) };
  }
  return null;
}

/* ============================================================
   ACTIONS
   ============================================================ */

function unlockAudio() { Audio.resume(); }

function go(screen) {
  state.prevScreen = state.screen;
  state.screen = screen;
  render();
}

function startChallenge() {
  unlockAudio();
  Audio.startAmbient();
  state.score = 0;
  state.round = 1;
  state.lives = CONFIG.startLives;
  state.streak = 0;
  state.correct = 0;
  state.total = 0;
  state.killer = null;
  state.falsePositive = null;
  state.cardIdx = 0;
  state.deck = buildDeck(state.round);
  state.tampering = rollTampering(state.round, state.deck[0]);
  state.locked = false;
  state.screen = "play";
  render();
  METERS.start();
  METERS.setOverride(meterEffectFor(state.deck[0]));
  maybePlayCardSound();
}

function startTraining(virusKey) {
  unlockAudio();
  Audio.startAmbient();
  state.trainingVirus = virusKey;
  state.trainingStreak = 0;
  state.screen = "training";
  state.locked = false;
  state.deck = buildTrainingDeck(virusKey);
  state.cardIdx = 0;
  state.tampering = rollTampering(10, state.deck[0]);
  render();
  METERS.start();
  METERS.setOverride(meterEffectFor(state.deck[0]));
  maybePlayCardSound();
}

function buildTrainingDeck(virusKey) {
  const v = VIRUSES[virusKey];
  const virusCards = v.errors.map(e => ({ ...e, isVirus: true, virusKey }));
  const legitCards = shuffle(LEGIT).slice(0, 12).map(e => ({ ...e, isVirus: false, virusKey: null }));
  return shuffle(virusCards.concat(virusCards).concat(legitCards));
}

function nextCard() {
  state.cardIdx++;
  state.locked = false;
  if (state.screen === "training") {
    if (state.cardIdx >= state.deck.length) {
      state.deck = buildTrainingDeck(state.trainingVirus);
      state.cardIdx = 0;
    }
    state.tampering = rollTampering(10, state.deck[state.cardIdx]);
    render();
    METERS.setOverride(meterEffectFor(state.deck[state.cardIdx]));
    maybePlayCardSound();
    return;
  }
  if (state.cardIdx >= state.deck.length) {
    if (state.round >= CONFIG.totalRounds) {
      Audio.levelUp();
      Audio.stopAmbient();
      METERS.stop();
      if (state.round > save.highestRound) { save.highestRound = state.round; Save.write(save); }
      state.screen = "win";
      render();
      return;
    }
    state.round++;
    if (state.round > save.highestRound) { save.highestRound = state.round; Save.write(save); }
    state.cardIdx = 0;
    state.deck = buildDeck(state.round);
    Audio.levelUp();
  }
  state.tampering = rollTampering(state.round, state.deck[state.cardIdx]);
  render();
  METERS.setOverride(meterEffectFor(state.deck[state.cardIdx]));
  maybePlayCardSound();
}

function maybePlayCardSound() {
  const card = state.deck[state.cardIdx];
  if (!card) return;
  if (card.scream) Audio.scream();
  else if (card.pulse) Audio.heartbeat();
  else if (card.nullify) Audio.glitch();
}

function choose(reportedAsVirus) {
  if (state.locked) return;
  const card = state.deck[state.cardIdx];
  if (!card) return;

  // Apply swap-tampering: the labels visually swapped but the player's
  // intent maps to the LABEL they clicked, not the underlying meaning.
  // The button data-action stays correct ("virus"/"check") because the
  // SWAP is purely cosmetic — the click already says what they intended.
  state.locked = true;
  const correct = reportedAsVirus === card.isVirus;
  state.total++;
  Audio.click();
  if (correct) {
    state.correct++;
    state.streak++;
    if (state.screen === "training") state.trainingStreak++;
    const bonus = Math.min(state.streak, CONFIG.streakCap) * CONFIG.streakBonus;
    state.score += CONFIG.scoreRight + bonus;
    Audio.correct();
    if (card.isVirus) unlockVirus(card.virusKey);
    showReveal(true, card);
    setTimeout(nextCard, 650);
  } else {
    state.streak = 0;
    if (state.screen === "training") {
      state.trainingStreak = 0;
      Audio.wrong();
      if (card.isVirus) unlockVirus(card.virusKey);
      showReveal(false, card);
      setTimeout(nextCard, 800);
      return;
    }
    state.score = Math.max(0, state.score + CONFIG.scoreWrong);
    state.lives--;
    if (card.isVirus) unlockVirus(card.virusKey);
    if (state.lives <= 0) {
      Audio.stopAmbient();
      METERS.stop();
      if (card.isVirus) {
        state.killer = card.virusKey;
        state.falsePositive = null;
        state.screen = "dying";
        render();
        Audio.death(card.virusKey);
        const dur = (DEATHS[card.virusKey] || {}).duration || 4500;
        state.deathTimeout = setTimeout(() => {
          state.deathTimeout = null;
          state.screen = "infected";
          render();
        }, dur);
      } else {
        state.killer = null;
        state.falsePositive = card;
        state.screen = "false-positive";
        render();
        Audio.gameOver();
      }
    } else {
      Audio.wrong();
      showReveal(false, card);
      setTimeout(nextCard, 850);
    }
  }
}

function showReveal(correct, card) {
  const r = document.getElementById("reveal");
  if (!r) return;
  r.className = "reveal " + (correct ? "correct" : "wrong");
  let label;
  if (correct) {
    label = card.isVirus ? ("Neutralized · " + card.virusKey) : "Clear";
  } else {
    label = card.isVirus ? ("Missed · " + card.virusKey) : "False Positive";
  }
  r.innerHTML = '<div class="stamp">' + esc(label) + "</div>";
  requestAnimationFrame(() => r.classList.add("show"));
  setTimeout(() => r.classList.remove("show"), 650);
}

function toggleCodex(key) {

function renderDesktop(card) {
  // pick icon style from filename suffix
  let cls = "exe";
  const t = (card.title || "").toLowerCase();
  if (t.includes(".pdf")) cls = "pdf";
  else if (t.includes(".zip")) cls = "zip";
  else if (t.includes(".exe")) cls = "exe";
  const glyph = cls === "pdf" ? "📄" : cls === "zip" ? "🗜" : "⚙";
  return `
    <div class="desktop-stage">
      <div class="desktop-icon selected">
        <div class="ico ${cls}">${glyph}</div>
        <div class="label">${esc(card.title)}</div>
      </div>
      <div class="desktop-tooltip">
        ${esc(card.message)}

function renderLoading(card) {

      <button class="btn danger big" data-action="virus">Report</button>
      <button class="btn primary big" data-action="check">OK</button>
    </div>`;
}

function renderCard(card) {
  switch (card.template) {
    case TPL.AV:       return renderAV(card);
    case TPL.BIOS:     return renderBIOS(card);
    case TPL.TERMINAL: return renderTerminal(card);
    case TPL.TOAST:    return renderToast(card);
    case TPL.DESKTOP:  return renderDesktop(card);
    case TPL.LOADING:  return renderLoading(card);
    case TPL.WIN11:
    default:           return renderWin11(card);
  }
}

    <div class="hud">

  return `
    <div class="panel stack fade-in">
      ${hud}

function render() {
  const app = document.getElementById("app");
  let html = "";
  switch (state.screen) {
    case "menu":              html = viewMenu(); break;
    case "settings":          html = viewSettings(); break;
    case "codex":             html = viewCodex(); break;
    case "training":          html = viewTraining(); break;
    case "training-pick":     html = viewTraining(); break;
    case "play":              html = viewPlay(false); break;
    case "epilepsy-warning":  html = viewEpilepsyWarning(); break;
    case "dying":             html = viewDying(); break;
    case "infected":          html = viewInfected(); break;
    case "false-positive":    html = viewFalsePositive(); break;
    case "win":               html = viewWin(); break;
    default:                  html = viewMenu();
  }
  app.innerHTML = html + '<div id="reveal" class="reveal"></div>';
}

document.addEventListener("click", (e) => {
  unlockAudio();
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const a = btn.dataset.action;
  switch (a) {
    case "play":
      startChallenge();
      break;
    case "confirm-warning":
      state.screen = "menu";
      render();
      break;
    case "skip-death":
      if (state.deathTimeout) { clearTimeout(state.deathTimeout); state.deathTimeout = null; }
      state.screen = "infected";
      render();
      break;
    case "training":
      state.trainingVirus = null;
      state.screen = "training-pick";
      render();
      break;
    case "train-pick":
      if (btn.hasAttribute("disabled")) return;
      startTraining(btn.dataset.key);
      break;
    case "codex":
      state.codexFilter = null;
      state.openCodex = null;
      state.prevScreen = state.screen;
      state.screen = "codex";
      render();
      break;
    case "pause-codex":
      state.codexFilter = null;
      state.openCodex = null;
      state.prevScreen = "play";
      state.screen = "codex";
      render();
      break;
    case "study-killer":
      if (!state.killer) break;
      state.codexFilter = state.killer;
      state.openCodex = state.killer;
      state.prevScreen = state.screen;
      state.screen = "codex";
      render();
      break;
    case "back-from-codex":
      state.codexFilter = null;
      state.openCodex = null;
      state.screen = state.prevScreen || "menu";
      render();
      // resume meter ticker if we returned to play/training
      if (state.screen === "play" || state.screen === "training") {
        const card = state.deck[state.cardIdx];
        if (card) METERS.setOverride(meterEffectFor(card));
      }
      break;
    case "toggle-entry":
      toggleCodex(btn.dataset.key);
      break;
    case "settings":
      state.prevScreen = state.screen;
      state.screen = "settings";
      render();
      break;
    case "toggle-photo":
      save.settings.photosensitive = !save.settings.photosensitive;
      Save.write(save);
      render();
      break;
    case "reset":
      if (confirm("Wipe all progress, codex unlocks, and settings?")) {
        Save.reset();
        save = Save.load();
        Audio.applyVolumes();
        state.screen = "menu";
        render();
      }
      break;
    case "menu":
      Audio.stopAmbient();
      METERS.stop();
      state.trainingVirus = null;
      state.screen = "menu";
      render();
      break;
    case "virus":  choose(true); break;
    case "check":  choose(false); break;
  }
});

document.addEventListener("input", (e) => {
  const s = e.target.dataset && e.target.dataset.setting;
  if (!s) return;
  save.settings[s] = parseFloat(e.target.value);
  Audio.applyVolumes();
  Save.write(save);
});

document.addEventListener("keydown", (e) => {
  if (state.screen !== "play" && state.screen !== "training") return;
  if (state.locked) return;
  if (e.key === "ArrowLeft" || e.key === "v" || e.key === "V" || e.key === "1") choose(true);
  if (e.key === "ArrowRight" || e.key === "c" || e.key === "C" || e.key === "2") choose(false);
});

/* ============================================================
   INIT
   ============================================================ */

render();
</script>
</body>
</html>
