<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatDetect</title>
<style>
  :root {
    --bg:        hsl(140 30% 3%);
    --bg-2:      hsl(140 25% 5%);
    --card:      hsl(140 22% 6%);
    --fg:        hsl(140 100% 78%);
    --primary:   hsl(140 100% 50%);
    --primary-2: hsl(140 100% 38%);
    --accent:    hsl(110 100% 60%);
    --destruct:  hsl(0 85% 55%);
    --muted:     hsl(140 20% 9%);
    --muted-fg:  hsl(140 30% 52%);
    --border:    hsl(140 45% 18%);
  }
  * { box-sizing: border-box; }
  html {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
  }
  body {
    margin: 0; padding: 0; height: 100%;
    background: transparent;  /* keep transparent so .bg-grid behind it stays visible */
    color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", "Segoe UI Mono", monospace; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,255,170,0.035) 0px, rgba(0,255,170,0.035) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: screen;
    z-index: 999;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    z-index: 998;
  }

  /* Ambient animated grid background */
  .bg-grid {
    position: fixed; inset: 0; z-index: -2;
    background-image:
      linear-gradient(rgba(0,255,120,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,120,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(600px) rotateX(60deg) translateY(20%);
    transform-origin: center top;
    animation: gridDrift 20s linear infinite;
    opacity: 0.35;
  }
  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 56px, 56px 0; }
  }
  /* Scrolling green code rain — vertical stream on top of the grid */
  .bg-grid::before {
    content: "echo $HOME 01101001 npm install grep -r curl localhost ssh -i ~/.ssh awk '{print $2}' cd /var/log sudo apt update ls -la /tmp ps aux | grep python netstat -an | head pkill -9 chmod +x ./run.sh git push origin main docker ps -a tail -f /var/log/sys cat /etc/passwd kubectl get pods nmap -sV 192.168.0.1 traceroute google.com whoami /priv ipconfig /flushdns echo 'access granted' rm -rf /tmp/* 11010 00111 01010101 SUDO ACCESS GRANTED openssl rand -hex 32 base64 -d /tmp/payload route -n iwconfig wlan0 systemctl status journalctl -xe dig +short example.com lsof -i :22 strace -p 1337 hexdump -C secret.bin gcc -O3 main.c objdump -d a.out gdb --batch ./shell ltrace ./binary nc -lvnp 4444 socat - tcp:localhost:80 tcpdump -i eth0 wireshark -k -i lo masscan 10.0.0.0/8 chmod 777 / find / -name '*.key' iptables -L -n -v dd if=/dev/zero of=/dev/sda bs=1M sudo -i su root locate id_rsa env | grep PATH source ~/.bashrc export DEBUG=1 unzip payload.zip tar -xzvf rootkit.tar.gz scp ./local.bin user@target python3 -m http.server crontab -e cat /var/log/auth.log fail2ban-client status sshd -p 4444 ngrok tcp 22 ";
    position: fixed; inset: 0;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 13px;
    color: rgba(0,255,120,0.42);
    text-shadow: 0 0 6px rgba(0,255,120,0.55);
    line-height: 1.55;
    letter-spacing: 0.14em;
    white-space: pre-wrap;
    word-break: break-all;
    padding: 10px;
    animation: codeRainScroll 22s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes codeRainScroll {
    from { transform: translateY(-50%); }
    to   { transform: translateY(50%); }
  }
  /* Second stream — hex/binary flowing horizontally as a faint ticker */
  .bg-grid::after {
    content: "0xDEADBEEF · 0xCAFEBABE · 0xFEEDFACE · 0xC0DEF00D · 192.168.1.1 · root@target · INTRUSION_DETECTED · 10101010 · 0xBAADF00D · 0xABAD1DEA · packet_loss=0.04% · uptime=14d · cpu=72% · 0xDEFEC8ED · scan_complete · port 22/tcp open · port 80/tcp open · port 443/tcp open · port 3389/tcp filtered · 0xFACEFEED · ssh-rsa AAAAB3 · whoami=root · 0xC001CAFE · payload.bin · 0xDEAD0000 · checksum_ok · auth_bypass · ";
    position: fixed;
    left: 0; right: 0; top: 0; bottom: 0;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    color: rgba(0,255,80,0.32);
    text-shadow: 0 0 5px rgba(0,255,80,0.5);
    line-height: 2.2;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    padding-top: 0;
    animation: codeTicker 26s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes codeTicker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  #app {
    position: relative;
    height: 100%;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    padding: 24px;
    overflow-y: auto;
  }
  .panel {
    width: 100%;
    max-width: 680px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    box-shadow:
      0 0 0 1px rgba(0,255,170,0.04),
      0 0 60px rgba(0,255,170,0.06);
    position: relative;
  }
  .panel.wide { max-width: 760px; }
  .center { text-align: center; }
  h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: 0.04em; }
  h1 {
    font-size: 2.6rem;
    color: var(--primary);
    text-shadow: 0 0 14px rgba(0,255,170,0.45);
    letter-spacing: 0.08em;
  }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 0.85rem; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.15em; }
  p { line-height: 1.55; margin: 0; }
  .mute { color: var(--muted-fg); font-size: 0.9rem; }
  .tiny { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-fg); }
  .row { display: flex; gap: 12px; }
  .row.between { justify-content: space-between; align-items: center; }
  .row.center { justify-content: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack.tight { gap: 6px; }
  .stack.loose { gap: 22px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--muted);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
  }
  .btn:hover { transform: translateY(-1px); background: hsl(220 15% 14%); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: var(--primary); color: var(--bg); border-color: var(--primary); box-shadow: 0 0 24px rgba(0,255,170,0.35); }
  .btn.primary:hover { background: var(--primary-2); }
  .btn.danger { background: rgba(255,60,60,0.1); border-color: var(--destruct); color: hsl(0 85% 78%); }
  .btn.danger:hover { background: rgba(255,60,60,0.22); }
  .btn.safe { background: rgba(0,255,170,0.08); border-color: var(--primary); color: var(--primary); }
  .btn.safe:hover { background: rgba(0,255,170,0.18); }
  .btn.big { padding: 16px 22px; font-size: 1rem; flex: 1; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; }

  /* HUD */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .hud .cell {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    cursor: default;
  }
  .hud .label { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted-fg); text-transform: uppercase; }
  .hud .value { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 2px; }
  button.cell { font-family: inherit; cursor: pointer; }
  button.cell:hover { background: hsl(220 15% 12%); }

  /* Fake telemetry meters */
  .meters {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 0.78rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    overflow-x: auto;
  }
  .meter { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .m-label {
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    color: var(--muted-fg);
    text-transform: uppercase;
  }
  .m-val { color: var(--primary); font-weight: 700; min-width: 1ch; display: inline-block; }
  .m-val.bad  { color: var(--destruct); text-shadow: 0 0 6px var(--destruct); }
  .m-val.warn { color: hsl(40 100% 65%); }
  .m-unit { color: var(--muted-fg); font-size: 0.7rem; }

  /* Menu */
  .logo {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    background: linear-gradient(180deg, #c8ffe6 0%, var(--primary) 60%, hsl(160 100% 30%) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(0,255,170,0.25);
  }
  .menu-btn {
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    font-size: 1rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .menu-btn:hover {
    background: hsl(220 18% 10%);
    border-color: var(--primary-2);
    transform: translateX(4px);
  }
  .menu-btn .arrow { color: var(--primary); }
  .menu-btn.danger { color: hsl(0 70% 75%); }
  .menu-btn.danger:hover { border-color: var(--destruct); }
  .menu-sub { font-size: 0.72rem; color: var(--muted-fg); margin-top: 4px; }

  /* Reveal feedback */
  .reveal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 100;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .reveal.show { opacity: 1; }
  .reveal .stamp {
    font-weight: 900;
    font-size: 2.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 14px 28px;
    border: 4px solid currentColor;
    border-radius: 8px;
    transform: rotate(-7deg);
    text-shadow: 0 0 18px currentColor;
    background: rgba(0,0,0,0.55);
  }
  .reveal.correct .stamp { color: var(--primary); }
  .reveal.wrong .stamp { color: var(--destruct); }

  /* Codex */
  .codex-list {
    max-height: 64vh;
    overflow-y: auto;
    padding-right: 6px;
  }
  .codex-list::-webkit-scrollbar { width: 8px; }
  .codex-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .codex-entry {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 6px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .codex-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }
  .codex-head:hover { background: hsl(220 18% 9%); }
  .codex-head .vname { font-size: 1rem; font-weight: 700; flex: 1; }
  .codex-head .vname.locked { color: var(--muted-fg); letter-spacing: 0.2em; }
  .codex-head .caret { color: var(--muted-fg); transition: transform 0.2s ease; }
  .codex-entry.open .codex-head .caret { transform: rotate(90deg); }
  .codex-body {
    padding: 0 16px 14px 16px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .codex-entry.open .codex-body { display: block; }
  .codex-body .desc { font-size: 0.92rem; color: hsl(160 30% 80%); margin: 12px 0; line-height: 1.55; }
  .codex-body ul { margin: 8px 0 0 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted-fg); }
  .codex-body li { margin: 3px 0; line-height: 1.45; }

  /* Per-virus accent colors */
  .v-EPILEPTICA { color: #ffffff; }
  .v-MELTDOWN   { color: #ff7733; }
  .v-STATIC     { color: #b0b0b0; }
  .v-REDRUM     { color: #cc1111; }
  .v-VOID       { color: #aa66ff; }
  .v-GASLIGHT   { color: #ffd56b; }
  .v-CRYPTEX    { color: #ffcc00; }
  .v-WORM       { color: #44ff44; }
  .v-ROOTKIT    { color: #ff3300; }
  .v-DDOS       { color: #ff8800; }
  .v-LEECH      { color: #aa00ff; }
  .v-SCREAMER   { color: #ff1166; }
  .v-MIMIC      { color: #66ddff; }
  .v-PULSE      { color: #ff55aa; }
  .v-NULL       { color: #777777; }
  .v-CURSOR     { color: #ffaa44; }
  .v-LOOP       { color: #88ff88; }
  .v-FOSSIL     { color: #c4a484; }
  .v-HEX        { color: #88ddff; }
  .v-BUGBEAR    { color: #ff9966; }
  .codex-entry.v-EPILEPTICA { border-left-color: #ffffff; }
  .codex-entry.v-MELTDOWN   { border-left-color: #ff7733; }
  .codex-entry.v-STATIC     { border-left-color: #b0b0b0; }
  .codex-entry.v-REDRUM     { border-left-color: #cc1111; }
  .codex-entry.v-VOID       { border-left-color: #aa66ff; }
  .codex-entry.v-GASLIGHT   { border-left-color: #ffd56b; }
  .codex-entry.v-CRYPTEX    { border-left-color: #ffcc00; }
  .codex-entry.v-WORM       { border-left-color: #44ff44; }
  .codex-entry.v-ROOTKIT    { border-left-color: #ff3300; }
  .codex-entry.v-DDOS       { border-left-color: #ff8800; }
  .codex-entry.v-LEECH      { border-left-color: #aa00ff; }
  .codex-entry.v-SCREAMER   { border-left-color: #ff1166; }
  .codex-entry.v-MIMIC      { border-left-color: #66ddff; }
  .codex-entry.v-PULSE      { border-left-color: #ff55aa; }
  .codex-entry.v-NULL       { border-left-color: #555555; }
  .codex-entry.v-CURSOR     { border-left-color: #ffaa44; }
  .codex-entry.v-LOOP       { border-left-color: #88ff88; }
  .codex-entry.v-FOSSIL     { border-left-color: #c4a484; }
  .codex-entry.v-HEX        { border-left-color: #88ddff; }
  .codex-entry.v-BUGBEAR    { border-left-color: #ff9966; }

  /* Animations */
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .flicker { animation: flicker 3.2s infinite; }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.78; }
  }
  .glitch {
    font-weight: 900;
    display: inline-block;
    text-shadow: 2px 0 var(--accent), -2px 0 var(--destruct);
    animation: glitch 0.55s infinite steps(2, end);
  }
  @keyframes glitch {
    0%{transform:translate(0,0);} 20%{transform:translate(-2px,1px);}
    40%{transform:translate(2px,-1px);} 60%{transform:translate(-1px,-2px);}
    80%{transform:translate(1px,2px);} 100%{transform:translate(0,0);}
  }
  /* UI tampering effects on the popup wrapper */
  .tamper-pulse { animation: tamperPulse 0.9s ease-in-out infinite; }
  @keyframes tamperPulse {
    0%, 100% { filter: brightness(1) saturate(1); transform: scale(1); }
    50%      { filter: brightness(1.25) saturate(1.1); transform: scale(1.015); }
  }
  .tamper-pulse-hard { animation: tamperPulseHard 0.55s ease-in-out infinite; }
  @keyframes tamperPulseHard {
    0%, 100% { filter: brightness(0.7); transform: scale(0.99); }
    50%      { filter: brightness(1.4); transform: scale(1.025); }
  }
  .tamper-shake { animation: tamperShake 0.18s ease-in-out infinite; }
  @keyframes tamperShake {
    0% { transform: translate(0,0); } 25% { transform: translate(-1px,1px); }
    50% { transform: translate(1px,-1px); } 75% { transform: translate(-1px,-1px); }
    100% { transform: translate(0,0); }
  }
  .tamper-null { opacity: 0.94; }
  .tamper-null .win-actions, .tamper-null .av-actions { visibility: hidden; }

  /* ============== PER-CARD EFFECTS (chosen by each error) ============== */
  .card-wrap { position: relative; }

  /* Buttons flicker — opacity + position jitter */
  .card-wrap.fx-btn-flicker [data-action="virus"],
  .card-wrap.fx-btn-flicker [data-action="check"] {
    animation: fxBtnFlicker 0.35s steps(2) infinite;
  }
  @keyframes fxBtnFlicker { 50% { opacity: 0.45; transform: translateX(2px); } }

  /* Static noise overlay on the popup */
  .card-wrap.fx-noise::after {
    content: ""; position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-conic-gradient(rgba(255,255,255,0.08) 0 0.5%, rgba(0,0,0,0.12) 0.5% 1%);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
    animation: fxNoise 0.04s steps(4) infinite;
    z-index: 50;
    border-radius: 8px;
  }
  @keyframes fxNoise {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(1px,-1px); }
    50%  { transform: translate(-1px,1px); }
    75%  { transform: translate(1px,1px); }
    100% { transform: translate(-1px,-1px); }
  }

  /* Popup sways side-to-side */
  .card-wrap.fx-wobble { animation: fxWobble 1.4s ease-in-out infinite; }
  @keyframes fxWobble {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25%      { transform: translateX(-4px) rotate(-0.4deg); }
    75%      { transform: translateX(4px) rotate(0.4deg); }
  }

  /* Border ring pulses red around the popup */
  .card-wrap.fx-border-pulse {
    border-radius: 8px;
    animation: fxBorderPulse 1.6s ease-in-out infinite;
  }
  @keyframes fxBorderPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,80,80,0); }
    50%      { box-shadow: 0 0 0 5px rgba(255,80,80,0.55), 0 0 30px rgba(255,80,80,0.35); }
  }

  /* Error/warning icon shakes */
  .card-wrap.fx-icon-shake .win-error-icon,
  .card-wrap.fx-icon-shake .av-icon {
    animation: fxIconShake 0.2s ease-in-out infinite;
  }
  @keyframes fxIconShake {
    0%, 100% { transform: translate(0,0); }
    25%      { transform: translate(-2px,1px); }
    75%      { transform: translate(2px,-1px); }
  }

  /* Game panel background tint when a virus card is showing */
  .panel.fx-bg-red    { background: hsl(0   45% 8%);  border-color: hsl(0   45% 22%); }
  .panel.fx-bg-blue   { background: hsl(220 45% 8%);  border-color: hsl(220 45% 22%); }
  .panel.fx-bg-amber  { background: hsl(40  45% 8%);  border-color: hsl(40  45% 22%); }
  .panel.fx-bg-green  { background: hsl(140 45% 7%);  border-color: hsl(140 45% 22%); }
  .panel.fx-bg-purple { background: hsl(280 45% 8%);  border-color: hsl(280 45% 22%); }

  /* Heading uses a different font than the body — feels uncanny */
  .card-wrap.fx-font-mismatch .win-heading,
  .card-wrap.fx-font-mismatch .av-heading {
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: 0.01em;
  }

  /* ============== POPUP TEMPLATES ============== */

  /* WIN11 LIGHT DIALOG — Mica-like gradient, accurate titlebar, rounded buttons */
  .win-dialog {
    background:
      linear-gradient(135deg, rgba(255,255,255,0.55), rgba(243,243,243,0.92) 30%, rgba(238,238,242,0.94) 100%),
      #f3f3f3;
    color: #1b1b1b;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.3) inset,
      0 0 0 1px rgba(0,0,0,0.05),
      0 28px 72px rgba(0,0,0,0.55),
      0 8px 20px rgba(0,0,0,0.32);
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .win-titlebar {
    display: flex; align-items: stretch; height: 32px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.4), rgba(243,243,243,0.15));
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .win-titlebar-left { display: flex; align-items: center; gap: 8px; padding: 0 12px; flex: 1; min-width: 0; }
  .win-app-icon {
    width: 16px; height: 16px; border-radius: 3px;
    background: linear-gradient(135deg, #0078d4 0%, #50b0ef 100%);
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }
  .win-title {
    font-size: 12px;
    font-weight: 400;
    color: #1b1b1b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .win-tb-btns { display: flex; }
  .win-tb-btn {
    width: 46px; height: 32px;
    border: 0; background: transparent;
    color: #1b1b1b;
    font-size: 10px; line-height: 1;
    cursor: default;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s ease;
  }
  .win-tb-btn:hover { background: rgba(0,0,0,0.06); }
  .win-tb-btn.close:hover { background: #c42b1c; color: #fff; }
  .win-body { background: #ffffff; display: flex; gap: 16px; padding: 24px 24px 18px 24px; }
  .win-error-icon { flex-shrink: 0; margin-top: 2px; }
  .win-content { flex: 1; min-width: 0; }
  .win-heading { font-size: 16px; font-weight: 600; color: #1b1b1b; margin: 0 0 8px; line-height: 1.3; }
  .win-message { font-size: 14px; color: #1b1b1b; line-height: 1.45; margin-bottom: 8px; word-wrap: break-word; }
  .win-meta { font-size: 12px; color: #5a5a5a; word-break: break-word; }
  .win-actions {
    background:
      linear-gradient(180deg, rgba(243,243,243,0.4), rgba(243,243,243,0.95));
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 14px 24px;
    display: flex; justify-content: flex-end; gap: 8px;
  }
  /* Action buttons inside Win11 popups — Win11-style rounded with subtle gradient */
  .win-dialog .win-actions .btn,
  .win-actions .btn {
    border-radius: 4px;
    padding: 6px 18px;
    height: 32px;
    min-width: 96px;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    font-weight: 400;
    border: 1px solid rgba(0,0,0,0.13);
    background: linear-gradient(180deg, #fdfdfd, #f5f5f5);
    color: #1b1b1b;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    text-transform: none;
    letter-spacing: 0;
    transition: background 0.1s ease, transform 0.05s ease;
  }
  .win-dialog .win-actions .btn:hover { background: linear-gradient(180deg, #f6f6f6, #ececec); transform: none; }
  .win-dialog .win-actions .btn.primary {
    background: linear-gradient(180deg, #0078d4, #006abf);
    color: #fff;
    border: 1px solid #006abf;
    box-shadow: 0 1px 0 rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.2) inset;
  }
  .win-dialog .win-actions .btn.primary:hover { background: linear-gradient(180deg, #0067bd, #005a9e); }
  .win-dialog .win-actions .btn.danger {
    background: linear-gradient(180deg, #fff5f5, #ffeaea);
    color: #b41c1c;
    border: 1px solid rgba(180,28,28,0.4);
  }
  .win-dialog .win-actions .btn.danger:hover { background: linear-gradient(180deg, #ffe5e5, #ffd0d0); }

  /* FAKE ANTIVIRUS WARNING */
  .av-dialog {
    background: linear-gradient(180deg, #fff7e6 0%, #ffe1c2 100%);
    color: #401400;
    border: 2px solid #b03000;
    border-radius: 6px;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    box-shadow: 0 0 0 1px #ffaa66, 0 20px 50px rgba(0,0,0,0.55);
  }
  .av-header {
    background: linear-gradient(180deg, #d62828, #b03000);
    color: #ffffff;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 800;
  }
  .av-header .badge {
    background: #fff; color: #b03000; padding: 3px 8px; border-radius: 3px;
    font-size: 10px; letter-spacing: 0.18em;
  }
  .av-body { padding: 22px; display: flex; gap: 18px; }
  .av-icon { font-size: 48px; line-height: 1; flex-shrink: 0; }
  .av-content { flex: 1; }
  .av-heading { font-size: 20px; font-weight: 800; color: #b03000; margin-bottom: 8px; text-transform: uppercase; }
  .av-message { font-size: 14px; line-height: 1.5; }
  .av-meta { margin-top: 10px; font-size: 12px; color: #5a2200; font-family: Consolas, monospace; }
  .av-actions { background: #ffe6cc; padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; }

  /* BIOS SCREEN */
  .bios {
    background: #0000a0;
    color: #ffffff;
    font-family: "Cascadia Mono", Consolas, "Lucida Console", monospace;
    border: 4px double #ffffff;
    padding: 16px;
    line-height: 1.4;
    font-size: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .bios-header {
    text-align: center; background: #c0c0c0; color: #0000a0;
    padding: 4px; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 12px;
  }
  .bios-row { display: flex; gap: 8px; }
  .bios-key { color: #ffff00; }
  .bios-warn { background: #ffff00; color: #0000a0; padding: 2px 6px; font-weight: 700; display: inline-block; margin-top: 8px; }
  .bios-actions {
    border-top: 1px dashed #ffffff;
    margin-top: 14px; padding-top: 10px;
    display: flex; justify-content: space-around;
    font-size: 13px;
  }
  .bios-actions .key { background: #c0c0c0; color: #0000a0; padding: 2px 8px; margin-right: 4px; font-weight: 700; }

  /* CORRUPTED TERMINAL */
  .term {
    background: #000;
    color: #4dff7c;
    font-family: "Cascadia Mono", Consolas, "Lucida Console", monospace;
    border: 1px solid #226633;
    border-radius: 4px;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 0 30px rgba(0,255,140,0.15), 0 20px 50px rgba(0,0,0,0.55);
  }
  .term-titlebar { background: #1a1a1a; color: #aaa; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #226633; }
  .term-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; box-shadow: 0 0 6px #ff4444; }
  .term-body { padding: 14px 16px; }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-line .prompt { color: #4dff7c; }
  .term-line .err { color: #ff5555; }
  .term-line .warn { color: #ffcc00; }
  .term-line .ok { color: #66ddff; }
  .term-cursor { display: inline-block; width: 7px; height: 14px; background: #4dff7c; vertical-align: -2px; animation: termBlink 1s steps(2) infinite; }
  @keyframes termBlink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
  .term-actions { padding: 10px 16px; background: #001100; border-top: 1px solid #226633; display: flex; justify-content: flex-end; gap: 10px; }
  .term-btn {
    background: #003300; color: #4dff7c; border: 1px solid #4dff7c;
    padding: 6px 14px; font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .term-btn:hover { background: #006600; }

  /* DESKTOP NOTIFICATION TOAST */
  .toast-stage {
    position: relative;
    height: 220px;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(0,80,140,0.4) 0%, transparent 70%),
      linear-gradient(180deg, #1f3a5f 0%, #0f1f33 100%);
    border-radius: 8px;
    border: 1px solid #2a4a73;
    overflow: hidden;
  }
  .toast-stage::after {
    content: "";
    position: absolute; left: 18px; bottom: 14px;
    width: 160px; height: 4px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
  }
  .toast {
    position: absolute; right: 18px; bottom: 36px;
    width: 320px;
    background: #2b2b2b;
    color: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    animation: toastSlide 0.5s ease;
  }
  @keyframes toastSlide { from { transform: translateX(380px); } to { transform: translateX(0); } }
  .toast-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: #1f1f1f;
    font-size: 11px; color: #ccc;
  }
  .toast-head .badge { width: 14px; height: 14px; border-radius: 3px; background: #0078d4; }
  .toast-body { padding: 12px 14px; }
  .toast-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .toast-msg { font-size: 13px; color: #d0d0d0; line-height: 1.4; }
  .toast-meta { margin-top: 6px; font-size: 11px; color: #888; word-break: break-word; }

  /* FAKE DESKTOP SHORTCUT */
  .desktop-stage {
    position: relative;
    min-height: 240px;
    background:
      radial-gradient(ellipse at 60% 30%, rgba(0,100,180,0.5) 0%, transparent 60%),
      linear-gradient(160deg, #0a1f3f 0%, #02060c 100%);
    border-radius: 8px;
    border: 1px solid #2a4a73;
    overflow: hidden;
    padding: 20px;
  }
  .desktop-icon {
    width: 96px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    cursor: default;
  }
  .desktop-icon.selected {
    background: rgba(0,120,212,0.3);
    outline: 1px dashed rgba(255,255,255,0.5);
    border-radius: 4px;
    padding: 4px;
  }
  .desktop-icon .ico {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-radius: 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: white;
  }
  .desktop-icon .ico.exe { background: linear-gradient(135deg, #aaaaaa, #777777); }
  .desktop-icon .ico.pdf { background: linear-gradient(135deg, #d63031, #a92020); }
  .desktop-icon .ico.zip { background: linear-gradient(135deg, #fdcb6e, #d4a017); color: #5a3a00; }
  .desktop-icon .label {
    color: white;
    font-size: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    word-break: break-all;
    line-height: 1.2;
  }
  .desktop-tooltip {
    position: absolute;
    left: 20px; bottom: 60px;
    max-width: 380px;
    background: #ffffe1;
    color: #1b1b1b;
    border: 1px solid #777;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.4;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.35);
    font-family: "Segoe UI", sans-serif;
  }
  .desktop-tooltip .small { color: #555; font-size: 11px; margin-top: 4px; }

  /* FAKE LOADING SCREEN */
  .loading {
    background: linear-gradient(180deg, #0a0a14, #050508);
    color: #ffffff;
    border: 1px solid #2a4a73;
    border-radius: 8px;
    padding: 36px 28px;
    text-align: center;
    font-family: "Segoe UI", sans-serif;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
  }
  .loading-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .loading-sub { font-size: 13px; color: #aaa; margin-bottom: 24px; }
  .loading-bar {
    height: 8px;
    background: #1a1a2a;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
  }
  .loading-fill {
    height: 100%;
    width: 60%;
    background: linear-gradient(90deg, #0078d4, #50b0ef, #0078d4);
    background-size: 200% 100%;
    animation: loadingShine 1.5s linear infinite;
    border-radius: 4px;
  }
  @keyframes loadingShine {
    from { background-position: 200% 0; }
    to   { background-position: 0 0; }
  }
  .loading-pct { font-size: 12px; color: #888; font-family: Consolas, monospace; }
  .loading-step { margin-top: 16px; font-size: 12px; color: #50b0ef; font-family: Consolas, monospace; }

  /* Settings */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px;
    gap: 16px;
  }
  .setting-row label { flex: 1; }
  .setting-row .desc { font-size: 0.75rem; color: var(--muted-fg); }
  .toggle {
    position: relative;
    width: 44px; height: 24px;
    background: var(--muted); border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--muted-fg);
    transition: left 0.15s ease, background 0.15s ease;
  }
  .toggle.on { background: rgba(0,255,170,0.2); border-color: var(--primary); }
  .toggle.on::after { left: 22px; background: var(--primary); }
  .slider {
    -webkit-appearance: none; appearance: none;
    width: 140px; height: 4px; background: var(--border); border-radius: 2px;
    outline: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--primary); cursor: pointer;
    box-shadow: 0 0 6px rgba(0,255,170,0.5);
  }
  .slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: 0;
  }

  /* Mini badge in menu */
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }

  /* "NEW" badge for first-time death to a virus */
  .new-badge {
    display: inline-block;
    vertical-align: middle;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    font-weight: 800;
    padding: 3px 8px;
    margin-left: 12px;
    border-radius: 4px;
    background: var(--primary);
    color: #000;
    border: 1px solid var(--primary);
    box-shadow:
      0 0 0 2px rgba(0,0,0,0.6),
      0 0 16px var(--primary),
      0 0 28px rgba(0,255,120,0.5);
    animation: newBadgePulse 1.1s ease-in-out infinite;
  }
  @keyframes newBadgePulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px var(--primary), 0 0 24px rgba(0,255,120,0.4); }
    50%      { transform: scale(1.08); box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 22px var(--primary), 0 0 36px rgba(0,255,120,0.7); }
  }

  /* Side-codex overlays the right side without disturbing the play panel.
     The play panel stays exactly where it normally renders; #app gets a
     right-padding bump (via body.side-codex-open) so the panel shifts
     LEFT to make room instead of being pushed up. */
  .codex-side {
    position: fixed;
    top: 24px;
    right: 24px;
    bottom: 24px;
    width: 520px;
    max-width: 46vw;
    overflow-y: auto;
    z-index: 100;
  }
  .codex-side .codex-list { max-height: none; }
  body.side-codex-open #app { padding-right: 568px; }
  @media (max-width: 1180px) {
    .codex-side { width: 440px; }
    body.side-codex-open #app { padding-right: 488px; }
  }
  @media (max-width: 980px) {
    body.side-codex-open #app { padding-right: 24px; padding-bottom: 50vh; }
    .codex-side { top: auto; right: 8px; left: 8px; bottom: 8px; width: auto; max-width: none; max-height: 48vh; }
  }

  /* Menu + leaderboard layout */
  .menu-row {
    display: flex;
    gap: 24px;
    align-items: stretch;
    justify-content: center;
    width: 100%;
    max-width: 1024px;
  }
  .menu-row > .panel { flex: 1 1 480px; max-width: 540px; }

  .lb-panel {
    flex: 0 0 280px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 18px;
    box-shadow:
      0 0 0 1px rgba(0,255,170,0.04),
      0 0 60px rgba(0,255,170,0.05);
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .lb-title {
    font-size: 0.75rem;
    letter-spacing: 0.24em;
    color: var(--primary);
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,255,170,0.35);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin: 0;
  }
  .lb-list { display: flex; flex-direction: column; gap: 4px; }
  .lb-row {
    display: grid;
    grid-template-columns: 22px 1fr auto auto auto;
    gap: 8px;
    align-items: baseline;
    padding: 5px 6px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-family: ui-monospace, Consolas, monospace;
  }
  .lb-row.top { background: rgba(0,255,170,0.08); }
  /* Medal coloring — gold / silver / bronze. Applied to the whole row tint
     plus the rank + name + score so the podium really pops. */
  .lb-row.rank-1 { background: linear-gradient(90deg, hsl(50 90% 50% / 0.18), transparent 70%); border-left: 3px solid hsl(50 100% 60%); }
  .lb-row.rank-2 { background: linear-gradient(90deg, hsl(210 15% 70% / 0.18), transparent 70%); border-left: 3px solid hsl(210 15% 75%); }
  .lb-row.rank-3 { background: linear-gradient(90deg, hsl(25 70% 50% / 0.18), transparent 70%); border-left: 3px solid hsl(25 80% 55%); }
  .lb-row.rank-1 .lb-rank, .lb-row.rank-1 .lb-score { color: hsl(50 100% 70%); text-shadow: 0 0 6px hsl(50 100% 50% / 0.4); }
  .lb-row.rank-2 .lb-rank, .lb-row.rank-2 .lb-score { color: hsl(210 15% 85%); text-shadow: 0 0 6px hsl(210 15% 70% / 0.4); }
  .lb-row.rank-3 .lb-rank, .lb-row.rank-3 .lb-score { color: hsl(25 85% 65%); text-shadow: 0 0 6px hsl(25 80% 50% / 0.4); }
  .lb-rank { font-weight: 700; color: var(--muted-fg); text-align: right; }
  .lb-score { font-weight: 700; color: var(--primary); }
  .lb-diff {
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted-fg);
  }
  .lb-diff.diff-easy      { color: hsl(140 60% 65%); background: hsla(140 60% 50% / 0.12); }
  .lb-diff.diff-normal    { color: hsl(200 60% 70%); background: hsla(200 60% 50% / 0.12); }
  .lb-diff.diff-hard      { color: hsl(30 90% 65%);  background: hsla(30 90% 50% / 0.14); }
  .lb-diff.diff-nightmare { color: hsl(0 80% 65%);   background: hsla(0 80% 50% / 0.16); }
  .lb-diff.diff-challenge { color: hsl(280 70% 75%); background: hsla(280 70% 50% / 0.14); }
  .lb-round { color: var(--muted-fg); font-size: 0.72rem; }
  .lb-date { color: var(--muted-fg); font-size: 0.72rem; }
  .lb-empty {
    color: var(--muted-fg);
    font-size: 0.78rem;
    text-align: center;
    padding: 18px 8px;
    line-height: 1.6;
  }
  .lb-outcome {
    font-size: 0.55rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: auto;
  }
  .lb-outcome.win { background: rgba(0,255,170,0.15); color: var(--primary); }
  .lb-outcome.infected { background: rgba(255,80,80,0.15); color: hsl(0 80% 75%); }
  .lb-outcome.fp { background: rgba(255,180,60,0.15); color: hsl(40 100% 70%); }

  @media (max-width: 820px) {
    .menu-row { flex-direction: column; align-items: stretch; max-width: 540px; }
    .menu-row > .panel { max-width: none; }
    .lb-panel { flex: 1 1 auto; }
  }

  /* Floating "+X ₢" toast shown when creditz are earned (round complete). */
  .creditz-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translate(-50%, -30px);
    z-index: 700;
    background: linear-gradient(180deg, rgba(70, 50, 0, 0.95), rgba(40, 28, 0, 0.95));
    border: 1px solid hsl(50 100% 50% / 0.6);
    border-radius: 8px;
    padding: 10px 18px;
    color: hsl(50 100% 75%);
    text-shadow: 0 0 10px hsl(50 100% 50% / 0.6);
    box-shadow: 0 0 24px hsl(50 100% 50% / 0.3), 0 6px 18px rgba(0,0,0,0.5);
    font-family: "Cascadia Mono", Consolas, monospace;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    pointer-events: none;
  }
  .creditz-toast strong { font-size: 1.4rem; font-weight: 800; line-height: 1; }
  .creditz-toast span   { font-size: 0.7rem; letter-spacing: 0.12em; color: hsl(50 60% 70%); }
  .creditz-toast.show   { opacity: 1; transform: translate(-50%, 0); }

  /* Shop layout */
  .shop-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 560px;
    margin: 24px auto 0;
    width: 100%;
  }
  .shop-item {
    display: flex;
    gap: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    text-align: left;
  }
  .shop-item-icon {
    font-size: 2.4rem;
    line-height: 1;
    flex-shrink: 0;
    width: 44px;
    text-align: center;
  }
  .shop-item-body { flex: 1; min-width: 0; }
  .shop-item-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .shop-item-name { font-weight: 700; font-size: 1.05rem; }
  .shop-item-price { font-weight: 700; color: hsl(50 100% 65%); }
  .shop-item-desc { font-size: 0.85rem; color: var(--muted-fg); line-height: 1.45; margin-bottom: 10px; }
  .shop-item-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Antivirus quarantine minigame */
  .minigame-stage {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #0a1a14 0%, #000 80%);
    z-index: 400;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #fff;
    animation: mgIntro 0.25s ease-out;
  }
  @keyframes mgIntro {
    from { opacity: 0; transform: scale(1.02); }
    to   { opacity: 1; transform: scale(1); }
  }
  .minigame-header {
    text-align: center;
    padding: 18px 14px 8px;
    z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
  }
  .minigame-field {
    flex: 1;
    position: relative;
  }
  .minigame-target {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5566, var(--destruct));
    color: #fff;
    font-size: 1.8rem;
    border: 2px solid #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px rgba(255, 80, 80, 0.7), 0 4px 12px rgba(0,0,0,0.4);
    transition: transform 0.08s ease-out, opacity 0.2s ease-out, background 0.2s;
    animation: mgPulse 1.2s ease-in-out infinite;
  }
  @keyframes mgPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(255, 80, 80, 0.7), 0 4px 12px rgba(0,0,0,0.4); }
    50%      { box-shadow: 0 0 28px rgba(255, 80, 80, 1),   0 4px 12px rgba(0,0,0,0.4); }
  }
  .minigame-target:hover {
    transform: translate(-50%, -50%) scale(1.15);
  }
  .minigame-target.hit {
    background: radial-gradient(circle at 35% 30%, #66ffaa, var(--primary));
    pointer-events: none;
    opacity: 0.35;
    animation: none;
    transform: translate(-50%, -50%) scale(0.6);
  }

  /* Post-mortem: the killer alert + active tells on the INFECTED / FALSE POSITIVE screens */
  .killer-display {
    margin: 8px auto 0;
    max-width: 540px;
    width: 100%;
    text-align: left;
  }
  .killer-label {
    text-align: center;
    margin-bottom: 10px;
    color: var(--muted-fg);
  }
  .killer-card {
    pointer-events: none;
    user-select: none;
    text-align: left;
    display: block;
    position: relative;
    min-height: 120px;
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(255, 80, 80, 0.35),
      0 0 24px rgba(255, 80, 80, 0.12),
      0 8px 28px rgba(0, 0, 0, 0.5);
    background: rgba(0, 0, 0, 0.25);
    padding: 8px;
  }
  /* Freeze all animations on the replayed card so it reads clearly */
  .killer-card *,
  .killer-card *::before,
  .killer-card *::after { animation-play-state: paused !important; }
  /* Ignore any active card-effect classes the player saw during play */
  .killer-card .win-dialog,
  .killer-card .av-dialog,
  .killer-card .bios,
  .killer-card .term,
  .killer-card .loading { animation: none !important; }
  .killer-tells {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--destruct);
    border-radius: 6px;
    padding: 14px 18px;
    text-align: left;
    max-width: 540px;
    margin: 0 auto;
  }
  .killer-tells.safe { border-left-color: hsl(40 100% 60%); }
  .killer-tells.safe .killer-tells-title { color: hsl(40 100% 65%); }
  .killer-tells-title {
    font-size: 0.7rem;
    letter-spacing: 0.24em;
    color: var(--destruct);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .killer-tells-list {
    margin: 0;
    padding-left: 18px;
    color: hsl(160 30% 80%);
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .killer-tells-list li {
    margin: 4px 0;
  }
  .tells-section { margin-top: 10px; }
  .tells-section:first-of-type { margin-top: 0; }
  .tells-section-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: hsl(0 60% 80%);
    margin-bottom: 4px;
  }
  .badge {
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px;
    background: var(--muted); color: var(--muted-fg);
    border: 1px solid var(--border);
  }

  /* ============== DEATH SEQUENCES (per virus) ============== */
  .death-stage {
    position: fixed; inset: 0; z-index: 500;
    background: #000; color: #fff;
    overflow: hidden;
  }
  /* Extra animation layer per virus — adds a 3rd-and-4th pseudo slot beyond ::before/::after */
  .death-fx {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  /* SYSTEM BREACH (viewInfected): the killer card fills the background, large + darkened.
     The breach summary panel floats above it in the center. */
  .breach-stage {
    position: fixed; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050608;
    overflow: hidden;
    z-index: 50;
  }
  /* The killing virus's full death animation plays in the background, darkened.
     We piggyback on the existing .death-XXX classes — they style backgrounds and
     pseudo elements regardless of which container they're on, so applying them
     on the inner div gives the same visuals as the full death stage but as a
     backdrop. The outer .breach-anim owns the dim/opacity so per-virus animations
     that override `filter` (e.g. PULSE) can't accidentally re-brighten the scene. */
  .breach-anim {
    position: absolute; inset: 0;
    z-index: 1;
    overflow: hidden;
    filter: brightness(0.5);
    opacity: 0.7;
    pointer-events: none;
  }
  .breach-anim > div {
    position: absolute; inset: 0;
  }
  .breach-content {
    position: relative;
    z-index: 5;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    backdrop-filter: blur(2px);
    background: rgba(8, 10, 14, 0.82);
  }
  .death-skip {
    position: fixed; right: 24px; bottom: 24px;
    z-index: 600; opacity: 0.75;
    background: rgba(0,0,0,0.65);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }
  .death-skip:hover { opacity: 1; background: rgba(0,0,0,0.85); }
  .death-stage.photo-safe::before,
  .death-stage.photo-safe::after,
  .death-stage.photo-safe .death-fx::before,
  .death-stage.photo-safe .death-fx::after {
    animation-duration: 2s !important;
    filter: brightness(0.65);
  }

  /* Per-virus photosensitive overrides — kill strobing for the worst offenders. */

  /* EPILEPTICA: black background, but the text content (centered title + corner text)
     stays visible. No strobing, no scanline scroll, no drift jitter. */
  .death-EPILEPTICA.photo-safe {
    background-color: #000 !important;
    background-image: none !important;
    animation: none !important;
  }
  .death-EPILEPTICA.photo-safe::before {
    animation: none !important;
    transform: none !important;
    text-shadow: 0 0 18px rgba(255,255,255,0.5) !important;
  }
  .death-EPILEPTICA.photo-safe::after {
    animation: none !important;
    transform: none !important;
    opacity: 0.85 !important;
  }
  .death-EPILEPTICA.photo-safe .death-fx::before {
    animation: none !important;
    transform: none !important;
    text-shadow: 0 0 12px rgba(255,255,255,0.4) !important;
  }

  /* STATIC: replace the chunky b/w pixel noise with a very slow full-screen
     fade between black and white. No fast strobing, no pattern. */
  .death-STATIC.photo-safe {
    background-color: #000 !important;
    background-image: none !important;
    animation: staticPhotoFade 5s ease-in-out infinite !important;
  }
  @keyframes staticPhotoFade {
    0%, 100% { background-color: #000; }
    50%      { background-color: #ffffff; }
  }
  .death-STATIC.photo-safe::before {
    background-image: none !important;
    animation: none !important;
    opacity: 0 !important;
  }

  /* SCREAMER: darker static red, no strobe, no rotating siren. */
  .death-SCREAMER.photo-safe {
    background: #1a0000 !important;
    animation: none !important;
  }
  .death-SCREAMER.photo-safe::before {
    animation: none !important;
    color: #4a0000 !important;
    text-shadow: none !important;
    opacity: 0.6 !important;
  }
  .death-SCREAMER.photo-safe::after {
    animation: none !important;
    opacity: 0.2 !important;
  }

  /* WORM is already "green on black with calm scroll" in normal mode — no extra photo-safe rules needed. */

  /* EPILEPTICA — strobing B/W background + colored bars sliding across + drifting text */
  .death-EPILEPTICA {
    background-color: #000;
    background-image:
      /* Scanlines scrolling vertically — kept for texture, no colored bars */
      repeating-linear-gradient(0deg, transparent 0 58px, rgba(140,140,140,0.5) 58px 62px, transparent 62px 120px);
    background-repeat: repeat;
    background-size: 100% 120px;
    animation:
      epBars 2.4s linear infinite,
      epBgFlash 0.1s steps(2) infinite;
  }
  @keyframes epBars {
    0%   { background-position: 0 0; }
    100% { background-position: 0 240px; }
  }
  @keyframes epBgFlash {
    0%   { background-color: #000; }
    50%  { background-color: #ffffff; }
    100% { background-color: #000; }
  }
  .death-EPILEPTICA::before {
    content: "EPILEPTICA";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 5rem; font-weight: 900;
    letter-spacing: 0.15em;
    color: #ffffff;
    text-shadow:
      3px 0 #ff00aa,
      -3px 0 #00ddff,
      0 0 28px rgba(255,255,255,0.45);
    mix-blend-mode: difference;
    animation: epGlitchDrift 0.6s steps(6) infinite;
  }
  /* Larger drift than before — text actually wanders around the center */
  @keyframes epGlitchDrift {
    0%   { transform: translate(0,0);     text-shadow: 3px 0 #ff00aa,  -3px 0 #00ddff,  0 0 28px rgba(255,255,255,0.45); }
    16%  { transform: translate(-18px, 10px); text-shadow: 6px -2px #ff00aa, -5px 2px #00ddff, 0 0 28px rgba(255,255,255,0.45); }
    33%  { transform: translate(22px, -14px); text-shadow: -4px 3px #ff00aa, 4px -3px #00ddff, 0 0 28px rgba(255,255,255,0.45); }
    50%  { transform: translate(-12px, -8px); text-shadow: 5px 2px #ff00aa, -6px -1px #00ddff, 0 0 28px rgba(255,255,255,0.45); }
    66%  { transform: translate(16px, 18px); text-shadow: -3px -4px #ff00aa, 5px 4px #00ddff, 0 0 28px rgba(255,255,255,0.45); }
    83%  { transform: translate(-20px, 4px); text-shadow: 7px 0 #ff00aa, -4px 0 #00ddff, 0 0 28px rgba(255,255,255,0.45); }
    100% { transform: translate(0,0);     text-shadow: 3px 0 #ff00aa,  -3px 0 #00ddff,  0 0 28px rgba(255,255,255,0.45); }
  }
  .death-EPILEPTICA::after {
    content: "SEIZURE                                                    OVERRIDE\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\AFLASH.EXE                                                  !!!!!!";
    white-space: pre;
    position: absolute; inset: 0; padding: 50px 60px;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 1.4rem; font-weight: 800;
    color: #ff00aa;
    text-shadow:
      2px 0 #00aaff,
      -2px 0 #ffff00,
      0 0 10px rgba(255,255,255,0.45);
    letter-spacing: 0.18em;
    line-height: 1.8;
    mix-blend-mode: difference;
    animation: epScatterDrift 0.55s steps(5) infinite;
  }
  /* Corner text drifts around to new positions each frame */
  @keyframes epScatterDrift {
    0%   { transform: translate(0,0);     opacity: 0.92; }
    20%  { transform: translate(-26px, 16px); opacity: 0.7; }
    40%  { transform: translate(22px, -18px); opacity: 1; }
    60%  { transform: translate(-14px, -22px); opacity: 0.8; }
    80%  { transform: translate(28px, 12px); opacity: 0.95; }
    100% { transform: translate(0,0);     opacity: 0.92; }
  }

  /* MELTDOWN — molten waterfall + heat blur + dense drip streaks */
  .death-MELTDOWN {
    background: linear-gradient(180deg, #1a0000 0%, #aa0000 30%, #ff5500 65%, #ffcc00 100%);
  }
  .death-MELTDOWN::before {
    content: ""; position: absolute; inset: -10%;
    background:
      repeating-linear-gradient(180deg,
        transparent 0 6px,
        rgba(255,120,0,0.65) 6px 10px,
        transparent 10px 25px,
        rgba(255,200,0,0.5) 25px 32px,
        transparent 32px 60px,
        rgba(255,60,0,0.6) 60px 66px),
      repeating-linear-gradient(180deg,
        transparent 0 14px,
        rgba(255,180,0,0.3) 14px 18px);
    background-size: 100% 200%, 100% 100%;
    mix-blend-mode: screen;
    filter: blur(1.5px);
    animation: meltDrip 3.2s linear infinite;
  }
  @keyframes meltDrip {
    from { background-position: 0 -320px, 0 0; }
    to   { background-position: 0 400px, 0 0; }
  }
  .death-MELTDOWN::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 100%, #ffaa00 0 12%, transparent 16%),
      radial-gradient(circle at 50% 100%, #ffcc00 0 18%, transparent 24%),
      radial-gradient(circle at 82% 100%, #ff7700 0 12%, transparent 16%),
      radial-gradient(circle at 32% 100%, #ff5500 0 10%, transparent 14%),
      radial-gradient(circle at 65% 100%, #ff8800 0 10%, transparent 14%);
    filter: blur(22px);
    animation: meltGlow 1.4s ease-in-out infinite alternate;
  }
  @keyframes meltGlow {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-45px) scale(1.25); opacity: 0.55; }
  }

  /* STATIC — chunky 64x64 pure black-and-white pixel noise. No color, no text. */
  .death-STATIC {
    background-color: #000;
    background-image: repeating-conic-gradient(
      from 0deg at 50% 50%,
      #fff 0 25%, #000 25% 50%, #fff 50% 75%, #000 75% 100%
    );
    background-size: 64px 64px;
    animation: staticPx 0.1s steps(6) infinite;
  }
  @keyframes staticPx {
    0%   { background-position: 0 0; }
    16%  { background-position: 32px 0; }
    33%  { background-position: 0 32px; }
    50%  { background-position: -32px 32px; }
    66%  { background-position: 32px -32px; }
    83%  { background-position: -32px 0; }
    100% { background-position: 0 0; }
  }
  .death-STATIC::before {
    /* Second 64x64 offset b/w layer, blended via difference for denser noise */
    content: ""; position: absolute; inset: 0;
    background-image: repeating-conic-gradient(
      from 90deg at 50% 50%,
      #000 0 25%, #fff 25% 50%, #000 50% 75%, #fff 75% 100%
    );
    background-size: 64px 64px;
    mix-blend-mode: difference;
    animation: staticPx2 0.08s steps(5) infinite;
  }
  @keyframes staticPx2 {
    0%   { background-position: 0 0; }
    20%  { background-position: 32px 32px; }
    40%  { background-position: -32px 0; }
    60%  { background-position: 0 -32px; }
    80%  { background-position: 32px -32px; }
    100% { background-position: 0 0; }
  }

  /* REDRUM — blood drip + splatter + reverse text */
  .death-REDRUM { background: #1a0000; }
  .death-REDRUM::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 0%,  #ff1111 0 6%,  transparent 14%),
      radial-gradient(circle at 22% 6%,  #aa0000 0 4%,  transparent 9%),
      radial-gradient(circle at 78% 10%, #bb0000 0 5%,  transparent 11%),
      radial-gradient(circle at 14% 22%, #880000 0 3%,  transparent 7%),
      radial-gradient(circle at 88% 28%, #aa0000 0 4%,  transparent 9%),
      linear-gradient(180deg, #660000 0%, #220000 70%, #000 100%);
    animation: redrumPulse 0.85s ease-in-out infinite;
  }
  @keyframes redrumPulse {
    0%, 100% { filter: brightness(1); transform: translateY(0); }
    50%      { filter: brightness(1.45) saturate(1.2); transform: translateY(-3px); }
  }
  .death-REDRUM::after {
    content: "REDRUM   ROOM 237   CARETAKER   OVERLOOK   REDRUM   ROOM 237   CARETAKER   OVERLOOK   REDRUM   ROOM 237";
    position: absolute; inset: 0; padding: 20px;
    font-family: monospace; font-size: 22px;
    color: #ff2222; letter-spacing: 6px; line-height: 2.2;
    word-spacing: 14px; white-space: pre-wrap;
    text-shadow: 0 0 14px #ff0000, 0 4px 8px rgba(255,0,0,0.6);
    opacity: 0.6;
    animation: redrumScroll 12s linear infinite;
    filter: blur(0.3px);
  }
  @keyframes redrumScroll { to { transform: translateY(-50%); } }

  /* VOID — calm star field that slowly fades between black and deep purple. */
  .death-VOID {
    background-color: #000;
    animation: voidFade 6s ease-in-out infinite;
  }
  @keyframes voidFade {
    0%, 100% { background-color: #000000; }
    50%      { background-color: #2a0044; }
  }
  /* Layer 1 of stars — small + soft */
  .death-VOID::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 6% 12%,  #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 14% 28%, #ddccff, transparent 60%),
      radial-gradient(2px   2px   at 22% 8%,  #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 32% 22%, #ccaaff, transparent 60%),
      radial-gradient(1.5px 1.5px at 38% 44%, #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 46% 16%, #ddccff, transparent 60%),
      radial-gradient(2.5px 2.5px at 54% 36%, #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 62% 6%,  #aa88ff, transparent 60%),
      radial-gradient(1.5px 1.5px at 70% 24%, #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 76% 42%, #ccbbff, transparent 60%),
      radial-gradient(2px   2px   at 84% 14%, #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 92% 30%, #aa99ff, transparent 60%),
      radial-gradient(1.5px 1.5px at 4% 58%,  #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 12% 72%, #ddccff, transparent 60%),
      radial-gradient(2px   2px   at 24% 86%, #ffffff, transparent 60%),
      radial-gradient(1.5px 1.5px at 36% 64%, #ccaaff, transparent 60%),
      radial-gradient(1px   1px   at 44% 78%, #ffffff, transparent 60%),
      radial-gradient(2px   2px   at 56% 56%, #ddccff, transparent 60%),
      radial-gradient(1.5px 1.5px at 64% 88%, #ffffff, transparent 60%),
      radial-gradient(1px   1px   at 72% 68%, #aa88ff, transparent 60%),
      radial-gradient(2.5px 2.5px at 80% 82%, #ffffff, transparent 60%),
      radial-gradient(1.5px 1.5px at 88% 60%, #ccbbff, transparent 60%),
      radial-gradient(2px   2px   at 96% 76%, #ffffff, transparent 60%);
    background-repeat: no-repeat;
  }
  /* Layer 2 of stars — slightly brighter, gently twinkling */
  .death-VOID::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(2.5px 2.5px at 18% 38%, #ffffff, transparent 60%),
      radial-gradient(1.5px 1.5px at 28% 70%, #e6d8ff, transparent 60%),
      radial-gradient(2px   2px   at 50% 88%, #ffffff, transparent 60%),
      radial-gradient(2.5px 2.5px at 66% 18%, #ffffff, transparent 60%),
      radial-gradient(1.5px 1.5px at 82% 50%, #e6d8ff, transparent 60%),
      radial-gradient(2px   2px   at 10% 92%, #ffffff, transparent 60%),
      radial-gradient(2.5px 2.5px at 42% 6%,  #ffffff, transparent 60%);
    background-repeat: no-repeat;
    animation: voidTwinkle 4s ease-in-out infinite;
  }
  @keyframes voidTwinkle {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* GASLIGHT — clock hands spinning + impossible dates flickering */
  .death-GASLIGHT { background: #1a1500; }
  .death-GASLIGHT::before {
    content: "1601-01-01\A 2025-02-30\A 9999-12-31\A 0000:00:00\A -1970-01-00\A 2031-13-32\A 1582-10-05";
    white-space: pre;
    position: absolute; inset: 0; padding: 40px;
    font-family: monospace; font-size: 2.4rem;
    color: #ffd56b; letter-spacing: 0.15em;
    text-align: center;
    opacity: 0.75;
    text-shadow: 0 0 12px #ffaa00;
    animation: gasFlicker 0.4s steps(2) infinite;
  }
  @keyframes gasFlicker {
    0%   { opacity: 0.75; transform: translate(0,0); }
    25%  { opacity: 0.2;  transform: translate(-4px,2px); }
    50%  { opacity: 0.75; transform: translate(0,0); }
    75%  { opacity: 0.4;  transform: translate(4px,-2px); }
    100% { opacity: 0.75; transform: translate(0,0); }
  }
  .death-GASLIGHT::after {
    content: ""; position: absolute; inset: 10%;
    border-radius: 50%;
    border: 22px solid rgba(255,213,107,0.18);
    background:
      conic-gradient(from 0deg at 50% 50%,
        transparent 0deg 88deg,
        rgba(255,213,107,0.7) 90deg 92deg,
        transparent 92deg 178deg,
        rgba(255,213,107,0.7) 180deg 182deg,
        transparent 182deg 268deg,
        rgba(255,213,107,0.7) 270deg 272deg,
        transparent 272deg 358deg,
        rgba(255,213,107,0.7) 358deg 360deg);
    animation: gasClock 1.8s linear infinite;
  }
  @keyframes gasClock { to { transform: rotate(720deg); } }

  /* CRYPTEX — file grid being locked left-to-right + countdown */

/* ============================================================
   CONFIG
   ============================================================ */

const CONFIG = {
  startLives: 1,
  cardsPerRound: 10,
  totalRounds: 10,
  scoreRight: 100,
  streakBonus: 50,
  streakCap: 10,
  scoreWrong: -50,
  starterUnlocked: ["EPILEPTICA", "STATIC", "MELTDOWN"]
};

/* ============================================================
   SAVE
   ============================================================ */

const SAVE_KEY = "threatdetect_save_v1";

const Save = {
  defaults() {
    return {
      highestRound: 1,
      highestScore: 0,
      unlocked: CONFIG.starterUnlocked.slice(),
      deathsBy: [],
      nightmareUnlocked: false,
      creditz: 0,
      antivirus: 0,
      settings: { master: 0.8, ambient: 0.4, sfx: 0.8, photosensitive: false, jumpscares: true }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return Save.defaults();
      const parsed = JSON.parse(raw);
      const d = Save.defaults();
      // If a previous version had a leaderboard inside the main save,
      // migrate it into the standalone leaderboard store and strip it from here.
      if (Array.isArray(parsed.leaderboard) && parsed.leaderboard.length) {
        const existing = Leaderboard.load();
        const merged = existing.concat(parsed.leaderboard);
        merged.sort((a, b) => (b.score || 0) - (a.score || 0));
        Leaderboard.write(merged.slice(0, 10));
      }
      return {
        highestRound: parsed.highestRound || d.highestRound,
        highestScore: parsed.highestScore || d.highestScore,
        unlocked: parsed.unlocked || d.unlocked,
        deathsBy: Array.isArray(parsed.deathsBy) ? parsed.deathsBy : d.deathsBy,
        nightmareUnlocked: !!parsed.nightmareUnlocked,
        creditz: typeof parsed.creditz === "number" ? parsed.creditz : d.creditz,
        antivirus: typeof parsed.antivirus === "number" ? parsed.antivirus : d.antivirus,
        settings: Object.assign(d.settings, parsed.settings || {})
      };
    } catch (e) { return Save.defaults(); }
  },
  write(s) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
  },
  reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }
};

/* Leaderboard lives in its OWN localStorage key so it survives Save.reset().
   Personal stats (best round, best score) are still wiped — only the top-runs list is global. */
const LB_KEY = "threatdetect_leaderboard_v2";
const Leaderboard = {
  load() {
    try {
      const raw = localStorage.getItem(LB_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  },
  write(list) {
    try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch (e) {}
  },
  add(entry) {
    const list = Leaderboard.load();
    list.push(entry);
    list.sort((a, b) => (b.score || 0) - (a.score || 0));
    const trimmed = list.slice(0, 10);
    Leaderboard.write(trimmed);
    return trimmed;
  }
};

let save = Save.load();

function unlockVirus(key) {
  if (!save.unlocked.includes(key)) {
    save.unlocked.push(key);
    Save.write(save);
  }
}

function recordRun(outcome) {
  // Effective difficulty label: "challenge" is its own mode, otherwise show the chosen difficulty.
  const difficulty = state.gameMode === "challenge" ? "challenge" : (state.difficulty || "normal");
  const entry = {
    score: state.score,
    round: state.round,
    accuracy: state.total ? Math.round(state.correct / state.total * 100) : 0,
    correct: state.correct,
    total: state.total,
    outcome: outcome,
    difficulty: difficulty,
    runId: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    date: new Date().toISOString().slice(0, 10)
  };
  // Leaderboard lives in a separate localStorage slot — survives reset
  Leaderboard.add(entry);
  // Personal best score lives in main save — wiped by reset
  if (state.score > (save.highestScore || 0)) {
    save.highestScore = state.score;
    Save.write(save);
  }
  // Award Creditz: round bonuses already accumulated in state.runCreditz +
  // 1 creditz per 100 points of final score, multiplied by leaderboard rank bonus.
  finalizeCreditz(entry);
}

/* ============================================================
   CREDITZ — the in-game currency
   ============================================================ */

const CREDITZ_PER_ROUND = {
  challenge: 20,
  easy:       2,
  normal:     5,
  hard:      10,
  nightmare: 15
};

/* Called when a round is completed. Pays the round bonus DIRECTLY to the wallet
   immediately (so the player sees it tick up and so quitting mid-run doesn't lose it). */
function awardRoundCreditz() {
  const mode = state.gameMode === "challenge" ? "challenge" : (state.difficulty || "normal");
  const amount = CREDITZ_PER_ROUND[mode] || 0;
  if (amount <= 0) return;
  state.runCreditz = (state.runCreditz || 0) + amount;
  save.creditz = (save.creditz || 0) + amount;
  Save.write(save);
  showCreditzToast("+" + amount + " ₢", "Round " + state.round + " cleared (" + mode + ")");
}

/* Called at end of run (in recordRun, after the entry is added). Adds score bonus
   and any leaderboard-rank multiplier bonus. Round bonuses were already paid out. */
function finalizeCreditz(entry) {
  const scoreCreditz = Math.floor(state.score / 100);
  const baseTotal = (state.runCreditz || 0) + scoreCreditz;
  // Find our rank in the leaderboard (we were just added).
  const lb = Leaderboard.load();
  const idx = lb.findIndex(e => e.runId === entry.runId);
  const rank = idx >= 0 ? idx + 1 : 0;
  const multiplier = rank === 1 ? 4 : rank === 2 ? 3 : rank === 3 ? 2 : 1;
  // Pay the score bonus now, then the multiplier delta on top of everything earned this run.
  const multBonus = baseTotal * (multiplier - 1);
  save.creditz = (save.creditz || 0) + scoreCreditz + multBonus;
  Save.write(save);
  state.lastRunCreditz = baseTotal * multiplier;
  state.lastRunMultiplier = multiplier;
  state.lastRunRank = rank;
  state.lastRunBaseCreditz = baseTotal;
}

/* Floating "+X ₢" notification that appears briefly on the screen. */
function showCreditzToast(amount, sub) {
  const el = document.createElement("div");
  el.className = "creditz-toast";
  el.innerHTML = '<strong>' + esc(amount) + '</strong><span>' + esc(sub || "") + '</span>';
  document.body.appendChild(el);
  // Force reflow so the transition runs from the initial state.
  void el.offsetWidth;
  el.classList.add("show");
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 400);
  }, 1800);
}


function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function describeMeterEffect(effect) {
  if (!effect) return [];
  const labels = [];
  const phrases = {
    fps: {
      flash: "FPS meter flickered wildly between 0 and 999",
      pulse: "FPS meter oscillated rhythmically between 60 and 120",
      "null": "FPS meter read NULL or ∞",
      blank: "FPS meter went blank (—)"
    },
    cpu: {
      kernel: "CPU meter read 'KERNEL' instead of a number",
      "null": "CPU meter read NULL or ∞",
      blank: "CPU meter went blank (—)"
    },
    ping: {
      spike: "PING meter spiked randomly between normal and 9999ms"
    },
    time: {
      wrong:     "System clock showed an impossible date",
      countdown: "System clock displayed a countdown timer instead of a time",
      room237:   "System clock stuck on the :37 mark (Room 237 reference)"
    }
  };
  for (const meter of Object.keys(effect)) {
    const value = effect[meter];
    if (phrases[meter] && phrases[meter][value]) {
      labels.push(phrases[meter][value]);
      continue;
    }
    if (typeof value === "number") {
      const unit = meter === "ping" ? "ms" : meter === "vol" ? "%" : meter === "cpu" ? "°C" : "";
      labels.push(meter.toUpperCase() + " meter pinned at " + value + unit);
      continue;
    }
    labels.push(meter.toUpperCase() + " meter showed '" + value + "'");
  }
  return labels;
}

function activeTells(card) {
  if (!card || !card.isVirus) return [];
  const tells = [];
  const v = VIRUSES[card.virusKey];
  if (!card.noMeter) {
    const effect = card.meterEffect || (v && v.meterEffect);
    describeMeterEffect(effect).forEach(t => tells.push(t));
  }
  if (card.btnFlicker)   tells.push("Report / OK buttons flickered on and off");
  if (card.bgShift)      tells.push("Game panel background shifted to a " + card.bgShift + " tint");
  if (card.noise)        tells.push("Static noise overlay flickered across the popup");
  if (card.wobble)       tells.push("Popup wobbled or swayed side-to-side");
  if (card.borderPulse)  tells.push("Pulsing red border around the popup");
  if (card.iconShake)    tells.push("Error icon shook in place");
  if (card.fontMismatch) tells.push("Heading font didn't match the body font");
  if (card.scream)       tells.push("Sudden loud audio sting played when the card appeared");
  if (card.pulse)        tells.push("Popup throbbed with a heartbeat pulse");
  if (card.nullify)      tells.push("UI elements were missing or hidden");
  return tells;
}
